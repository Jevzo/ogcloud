# Single source of truth for JVM versions (AGENTS.md §9). Renovate keeps them current (D-0052).
[versions]
kotlin = "2.4.21"
spring-boot = "4.1.2"
spotless = "8.11.0"
ktlint = "1.8.0"
shadow = "9.6.1"
junit = "6.1.3"
kotest = "6.2.6"
mockk = "1.14.11"
protobuf = "4.36.2"
protobuf-plugin = "0.10.1"
grpc = "1.85.1"
binary-compatibility-validator = "0.18.2"
asm = "9.11.1"
aws-sdk = "2.57.9"
fabric8 = "8.0.0"
springdoc = "3.2.0"
webauthn4j = "0.32.0.RELEASE"
playwright = "1.64.0"
