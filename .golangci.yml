version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    wrapcheck:
      # Errors from our own packages are already wrapped where they originate.
      ignore-package-globs:
        - github.com/jevzo/ogcloud/*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jevzo/ogcloud
