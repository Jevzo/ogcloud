min_version = "2026.10.19"

# Single source of truth for tool versions (AGENTS.md §9). Renovate keeps them current (D-0052).
[tools]
java = "temurin-25.0.5+8.0.LTS"
go = "1.27.3"
node = "26.13.0"
pnpm = "12.18.0"
terraform = "1.17.1"
helm = "4.3.1"
kubectl = "1.37.2"
minikube = "1.39.0"
tilt = "0.37.8"
buf = "1.75.0"
golangci-lint = "2.15.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
kubeconform = "0.8.0"
k3d = "5.9.0"
gitleaks = "8.30.1"
trivy = "0.76.2"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# Each ecosystem adds its own check, fmt, build and test tasks as it lands (T-0004 to T-0008);
# `check` aggregates them through `depends`.
[tasks.check]
description = "Run every quality gate: lint, format check, tests, secret scan"
depends = ["check:secrets", "check:jvm", "check:go", "check:ts", "check:chart", "check:shell", "check:duplication", "check:proto", "check:terraform", "check:generated", "check:vulns", "check:actions", "check:commits"]

[tasks."check:secrets"]
description = "Scan the working tree and git history for committed secrets"
run = [
  "gitleaks dir . --redact --no-banner",
  # Only this branch: the v1 branches in the same repository carry their own history.
  "gitleaks git . --redact --no-banner --log-opts=HEAD",
]

[tasks."check:jvm"]
description = "Kotlin format check, compile with warnings as errors, tests, build-logic convention tests"
run = "./gradlew check"

# Artifacts are built here with mise's toolchains and staged in build/images; the platform Dockerfile only copies them.
[tasks."dev:cluster"]
description = "Start (or create) the minikube profile OgCloud's dev loop runs on (D-0022, D-0155)"
run = "minikube start --profile ogcloud --driver docker --cpus 6 --memory 14g --cni calico --container-runtime docker --kubernetes-version v1.37.0"

[tasks.dev]
description = "Run OgCloud on minikube with Tilt; OGCLOUD_MONITORING=true adds the monitoring stack"
depends = ["dev:cluster"]
run = "tilt up"

[tasks."dev:ci"]
description = "Bring OgCloud up on minikube once and fail unless every resource gets ready (T-0604)"
depends = ["dev:cluster"]
run = "tilt ci --timeout 45m"

[tasks."dev:clean"]
description = "Stop the dev loop, delete the minikube profile and its images"
run = ["tilt down || true", "minikube delete --profile ogcloud"]

[tasks."images:build"]
description = "Build every server and platform image into the local Docker store (REGISTRY and VERSION tag them)"
shell = "bash -c"
run = """
set -euo pipefail
out=build/images
rm -rf "$out"
mkdir -p "$out/plugins"
./gradlew :control-plane:api:bootJar :control-plane:controller:bootJar :integrations:paper:shadowJar :integrations:legacy-paper:shadowJar :integrations:velocity:shadowJar
for service in api controller; do
  java -Djarmode=tools -jar "control-plane/$service/build/libs/$service.jar" extract --layers --launcher --destination "$out/$service"
done
# The controller ships OgCloud's plugins as ogcloud-<platform>.jar (D-0079).
cp integrations/paper/build/libs/paper-all.jar "$out/plugins/ogcloud-paper.jar"
cp integrations/legacy-paper/build/libs/legacy-paper-all.jar "$out/plugins/ogcloud-pandaspigot.jar"
cp integrations/velocity/build/libs/velocity-all.jar "$out/plugins/ogcloud-velocity.jar"
arch=$(docker version --format '{% raw %}{{.Server.Arch}}{% endraw %}')
build() { (cd data-plane && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" "$@"); }
for binary in gateway loadbalancer template-loader bootstrap backup; do
  build -o "../$out/linux-$arch/$binary" "./cmd/$binary"
done
# Only for the contract test (T-0510): fake pod identities, never published.
build -tags contracttest -o "../$out/linux-$arch/gateway-contracttest" ./cmd/gateway
docker buildx bake -f images/docker-bake.json -f images/docker-bake.hcl --load default platform test
"""

# Not part of `check`: it builds every image, boots the server images with OgCloud's plugins, starts the platform
# images, runs the gateway contract test (T-0510) and scans them, which needs Docker and the network (D-0139).
[tasks."check:images"]
description = "Build every image, smoke- and contract-test them, and fail on critical CVEs in the platform images"
shell = "bash -c"
env = { REGISTRY = "ogcloud-local", VERSION = "dev" }
run = """
set -euo pipefail
mise run images:build
./gradlew :images:smoke-test:test -Pogcloud.smoke
for image in api controller gateway loadbalancer template-loader bootstrap backup; do
  trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$REGISTRY/$image:$VERSION"
done
"""

[tasks."fmt:jvm"]
description = "Format Kotlin sources and Gradle scripts"
run = "./gradlew spotlessApply"

# go.work modules are listed by `go list -m`; `./...` does not span workspace modules.
# Every Terraform module and root: format, validate, and the modules' tests (AGENTS.md §11).
[tasks."check:terraform"]
description = "terraform fmt, validate and test for every Terraform module and root"
shell = "bash -c"
run = """
set -euo pipefail
terraform fmt -check -recursive deploy/terraform
for dir in deploy/terraform/modules/* deploy/terraform/render; do
  echo "== $dir"
  terraform -chdir="$dir" init -backend=false -input=false >/dev/null
  terraform -chdir="$dir" validate
  if [ -d "$dir/tests" ]; then
    terraform -chdir="$dir" test
  fi
done
"""

# Infisical's root key and bootstrap's state for a restore (D-0166): export it after the first install and keep the
# file off the cluster; import it into a fresh cluster before installing with restore.fromServer.
[tasks."backup:root-key"]
description = "Export Infisical's root key and bootstrap's state from the current cluster (D-0166)"
usage = 'arg "[file]" default="build/backup/root-key.yaml"'
run = 'deploy/backup/root-key.sh export {{usage.file}}'

[tasks."backup:restore-root-key"]
description = "Apply an exported root key and bootstrap state to the current cluster before a restore (D-0166)"
usage = 'arg "[file]" default="build/backup/root-key.yaml"'
run = 'deploy/backup/root-key.sh import {{usage.file}}'

# The end-to-end suite (T-0606, D-0161) against the minikube dev profile while `mise run dev` holds its port-forwards;
# OGCLOUD_E2E_* point it elsewhere.
[tasks.seed]
description = "Create the owner, the suite's machine client, the groups and the lobby template (T-0606)"
run = "pnpm --filter @ogcloud/e2e run seed"

[tasks."test:e2e"]
description = "Run the end-to-end suite against a seeded cluster (T-0606)"
depends = ["seed"]
run = "pnpm --filter @ogcloud/e2e run test"

# Not part of `check`: it builds every image and installs everything on a k3d cluster, which takes a while (T-0605).
[tasks."test:k3s"]
description = "Apply every k3s HelmChart at once to a fresh k3d cluster and wait until OgCloud converges (T-0605)"
run = "deploy/k3s/ordering-test.sh"

# Not part of `check` either: two installs on k3d with a backup and a restore in between (T-0607).
[tasks."test:restore"]
description = "Back up OgCloud on k3d, delete the cluster and restore it into a fresh one (T-0607)"
run = "deploy/k3s/restore-test.sh"

# Load tests on real time (T-0609, D-0175): the load balancer's accept rate in its package.
[tasks."test:load"]
description = "Run the load tests: the load balancer's accept rate (T-0609)"
dir = "data-plane"
env = { OGCLOUD_LOAD = "true" }
run = "go test -count=1 -run TestTakesFiveHundredNewLoginsASecond -v ./loadbalancer/"

# Not part of `check` either: N-1 from a git worktree installed on k3d, upgraded to this checkout (T-0608, D-0172).
[tasks."test:upgrade"]
description = "Install N-1 on k3d, upgrade it to this checkout and run the end-to-end suite (T-0608)"
run = "deploy/k3s/upgrade-test.sh"

[tasks."check:shell"]
description = "shellcheck every tracked shell script"
shell = "bash -c"
run = """
set -euo pipefail
git ls-files -z '*.sh' | xargs -0 shellcheck
"""

# Lints the chart and validates every value set in its ci/ folder (D-0148); the Go render tests in
# data-plane/deploytest run with check:go. Schemas come from pinned commits, so a run is reproducible.
[tasks."check:chart"]
description = "helm lint and kubeconform for every value set of the OgCloud chart, then every platform chart rendered"
shell = "bash -c"
run = """
set -euo pipefail
chart=deploy/helm/ogcloud
kubernetes_schemas="https://raw.githubusercontent.com/yannh/kubernetes-json-schema/c416d7b0da0751bd8ebe5be4fa4c8e8274e3bbe2/{{ '{{' }}.NormalizedKubernetesVersion{{ '}}' }}-standalone{{ '{{' }}.StrictSuffix{{ '}}' }}/{{ '{{' }}.ResourceKind{{ '}}' }}{{ '{{' }}.KindSuffix{{ '}}' }}.json"
crd_schemas="https://raw.githubusercontent.com/datreeio/CRDs-catalog/49729e49e8f062933e3716a26540d41b0cd0856c/{{ '{{' }}.Group{{ '}}' }}/{{ '{{' }}.ResourceKind{{ '}}' }}_{{ '{{' }}.ResourceAPIVersion{{ '}}' }}.json"
for values in "$chart"/ci/*.yaml; do
  echo "== $values"
  helm lint --strict "$chart" -f "$values"
  helm template ogcloud "$chart" --namespace ogcloud -f "$values" \
    | kubeconform -strict -summary -kubernetes-version 1.37.0 \
        -schema-location "$kubernetes_schemas" -schema-location "$crd_schemas"
done
# Every chart in platform-deps.yaml with its values and each target's, cached in build/charts (D-0187).
OGCLOUD_RENDER_PLATFORM_CHARTS=true go -C data-plane test -count=1 -run TestEveryPlatformChartRendersWithItsValues ./deploytest/
"""

[tasks."check:go"]
description = "go vet, tests with -race, golangci-lint and tidy check for every Go module"
shell = "bash -c"
run = """
set -euo pipefail
for module in $(go list -m -f '{% raw %}{{.Dir}}{% endraw %}'); do
  echo "== $module"
  cd "$module"
  go mod tidy -diff
  if [ -z "$(go list ./... 2>/dev/null)" ]; then
    echo "no packages yet, skipping"
  else
    # One command per line: set -e ignores a failure inside an && list.
    go vet ./...
    go test -race ./...
    golangci-lint run ./...
  fi
done
# The gateway's contract-test variant (T-0510) only compiles with its build tag.
cd "{{config_root}}/data-plane"
go vet -tags contracttest ./cmd/gateway
golangci-lint run --build-tags contracttest ./cmd/gateway/...
"""

[tasks."fmt:go"]
description = "Format Go sources"
shell = "bash -c"
run = """
set -euo pipefail
for module in $(go list -m -f '{% raw %}{{.Dir}}{% endraw %}'); do
  (cd "$module" && golangci-lint fmt ./...)
done
"""

[tasks."check:ts"]
description = "Biome lint and format check, type-check every TS package, then their unit tests"
run = ["pnpm exec biome ci", "pnpm -r --if-present run typecheck", "pnpm -r --if-present run test:unit"]

[tasks."fmt:ts"]
description = "Format and fix TypeScript, JavaScript and JSON"
run = "pnpm exec biome check --write"

[tasks."check:duplication"]
description = "Duplicate-code check across Kotlin, Go and TypeScript (AGENTS.md §15)"
run = "pnpm exec jscpd ."

[tasks."check:proto"]
description = "buf lint and format check for contracts/proto"
shell = "bash -c"
run = """
set -euo pipefail
if [ -z "$(find contracts/proto -name '*.proto' -print -quit)" ]; then
  echo "no .proto files yet, skipping"
  exit 0
fi
buf lint
buf format --diff --exit-code
"""

[tasks.gen]
description = "Regenerate every generated source from contracts/"
depends = ["gen:proto", "gen:profiles", "gen:topics", "gen:livestate", "gen:pod-labels", "gen:permission-nodes", "gen:kafka-keys", "gen:template-objects", "gen:pod-env", "gen:live-channels", "gen:node-errors", "gen:session-keepalive", "gen:api-client"]

[tasks."gen:api-client"]
description = "Generate the TypeScript API client from contracts/openapi/openapi.yaml (D-0163)"
run = "pnpm --filter @ogcloud/api-client run generate"

[tasks."gen:proto"]
description = "Generate Go code from contracts/proto"
shell = "bash -c"
run = """
set -euo pipefail
if [ -z "$(find contracts/proto -name '*.proto' -print -quit)" ]; then
  echo "no .proto files yet, skipping"
  exit 0
fi
buf generate
"""

[tasks."gen:profiles"]
description = "Generate the runtime profile catalog from contracts/runtime-profiles.yaml"
run = "go run ./data-plane/pkg/cmd/codegen profiles -in contracts/runtime-profiles.yaml -go-out data-plane/pkg/runtimeprofiles/catalog.gen.go -kotlin-out control-plane/domain/src/generated/kotlin/io/ogwars/cloud/domain/runtime/RuntimeProfiles.kt -bake-out images/docker-bake.json"

[tasks."gen:topics"]
description = "Generate Go and Kotlin topic constants and the chart's Strimzi topics and users from contracts/kafka/topics.yaml"
run = "go run ./data-plane/pkg/cmd/codegen topics -in contracts/kafka/topics.yaml -go-package kafkatopics -go-out data-plane/pkg/kafkatopics/topics.gen.go -kotlin-out control-plane/messaging/src/generated/kotlin/io/ogwars/cloud/messaging/KafkaTopics.kt -strimzi-out deploy/helm/ogcloud/templates/kafka/topics.gen.yaml"

[tasks."gen:livestate"]
description = "Generate the Valkey key layout for Go and Kotlin from contracts/livestate/keys.yaml (D-0111)"
run = "go run ./data-plane/pkg/cmd/codegen livestate -in contracts/livestate/keys.yaml -go-out data-plane/pkg/valkeykeys/keys.gen.go -kotlin-out control-plane/livestate/src/generated/kotlin/io/ogwars/cloud/livestate/ValkeyKeys.kt -kotlin-kinds-out control-plane/domain/src/generated/kotlin/io/ogwars/cloud/domain/store/LiveStateKinds.kt"

[tasks."gen:pod-labels"]
description = "Generate the pod labels for Go and Kotlin from contracts/pod-labels.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/pod-labels.yaml -go-package podlabels -go-out data-plane/pkg/podlabels/labels.gen.go -kotlin-package io.ogwars.cloud.controller.kube -kotlin-out control-plane/controller/src/generated/kotlin/io/ogwars/cloud/controller/kube/PodLabels.kt"

[tasks."gen:permission-nodes"]
description = "Generate the in-game permission nodes for Go and Kotlin from contracts/permission-nodes.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/permission-nodes.yaml -go-package permissionnodes -go-out data-plane/pkg/permissionnodes/nodes.gen.go -kotlin-package io.ogwars.cloud.contracts -kotlin-out contracts/src/generated/kotlin/io/ogwars/cloud/contracts/PermissionNodes.kt"

[tasks."gen:kafka-keys"]
description = "Generate the fixed Kafka keys for Go and Kotlin from contracts/kafka/keys.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/kafka/keys.yaml -go-package kafkakeys -go-out data-plane/pkg/kafkakeys/keys.gen.go -kotlin-package io.ogwars.cloud.contracts -kotlin-out contracts/src/generated/kotlin/io/ogwars/cloud/contracts/KafkaKeys.kt"

[tasks."gen:template-objects"]
description = "Generate the template object layout for Go and Kotlin from contracts/storage/templates.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/storage/templates.yaml -go-package templateobjects -go-out data-plane/pkg/templateobjects/objects.gen.go -kotlin-package io.ogwars.cloud.domain.template -kotlin-out control-plane/domain/src/generated/kotlin/io/ogwars/cloud/domain/template/TemplateObjects.kt"

[tasks."gen:pod-env"]
description = "Generate the game pods' environment variable names for Go and Kotlin from contracts/pod-env.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/pod-env.yaml -go-package podenv -go-out data-plane/pkg/podenv/env.gen.go -kotlin-package io.ogwars.cloud.contracts -kotlin-out contracts/src/generated/kotlin/io/ogwars/cloud/contracts/PodEnv.kt"

[tasks."gen:session-keepalive"]
description = "Generate the node session keepalive timing for Go and Kotlin from contracts/session-keepalive.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/session-keepalive.yaml -go-package sessionkeepalive -go-out data-plane/pkg/sessionkeepalive/keepalive.gen.go -kotlin-package io.ogwars.cloud.contracts -kotlin-out contracts/src/generated/kotlin/io/ogwars/cloud/contracts/SessionKeepalive.kt"

[tasks."gen:live-channels"]
description = "Generate the live-channel limits for Go and Kotlin from contracts/live-channels.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/live-channels.yaml -go-package livechannels -go-out data-plane/pkg/livechannels/limits.gen.go -kotlin-package io.ogwars.cloud.contracts -kotlin-out contracts/src/generated/kotlin/io/ogwars/cloud/contracts/LiveChannelLimits.kt"

[tasks."gen:node-errors"]
description = "Generate the gateway's refusal reasons for Go and Kotlin from contracts/node-errors.yaml"
run = "go run ./data-plane/pkg/cmd/codegen constants -in contracts/node-errors.yaml -go-package nodeerrors -go-out data-plane/pkg/nodeerrors/errors.gen.go -kotlin-package io.ogwars.cloud.contracts -kotlin-out contracts/src/generated/kotlin/io/ogwars/cloud/contracts/NodeErrors.kt"

# Each generator's output path is listed here when its first real output is wired (T-0101, T-0102).
[tasks."check:generated"]
description = "Fail when committed generated sources differ from a fresh `mise run gen`"
depends = ["gen"]
shell = "bash -c"
run = """
set -euo pipefail
generated=(data-plane/pkg/gen data-plane/pkg/runtimeprofiles/catalog.gen.go images/docker-bake.json deploy/helm/ogcloud/templates/kafka/topics.gen.yaml data-plane/pkg/kafkatopics data-plane/pkg/valkeykeys data-plane/pkg/podlabels data-plane/pkg/permissionnodes data-plane/pkg/kafkakeys data-plane/pkg/templateobjects data-plane/pkg/podenv data-plane/pkg/livechannels data-plane/pkg/nodeerrors data-plane/pkg/sessionkeepalive contracts/src/generated control-plane/domain/src/generated control-plane/messaging/src/generated control-plane/livestate/src/generated control-plane/controller/src/generated packages/api-client/src/generated)
if [ -n "$(git status --porcelain --untracked-files=all -- "${generated[@]}")" ]; then
  git status --short -- "${generated[@]}"
  echo "Generated sources are out of date: run 'mise run gen' and commit the result." >&2
  exit 1
fi
"""

[tasks."hooks:install"]
description = "Install the git commit-msg hook (Conventional Commits, no AI attribution)"
run = "mise generate git-pre-commit --hook commit-msg --task commit-msg --write"

[tasks.commit-msg]
description = "Validate one commit message file (used by the git hook)"
hide = true
run = "go run ./data-plane/pkg/cmd/commitmsg"

# CI sets OGCLOUD_COMMIT_RANGE to the pushed or pull-request range; locally every unpushed commit is checked.
[tasks."check:commits"]
description = "Validate the messages of all commits in range"
shell = "bash -c"
run = """
set -euo pipefail
if [ -n "${OGCLOUD_COMMIT_RANGE:-}" ]; then
  commits=$(git rev-list --no-merges "$OGCLOUD_COMMIT_RANGE")
else
  commits=$(git rev-list --no-merges HEAD --not --remotes)
fi
go build -o .gradle/commitmsg ./data-plane/pkg/cmd/commitmsg
for commit in $commits; do
  # Renovate writes its own Conventional Commit headers, often longer than our 72-character limit.
  if [ "$(git log -1 --format=%an "$commit")" = "renovate[bot]" ]; then continue; fi
  git log -1 --format=%B "$commit" | .gradle/commitmsg - || { echo "in commit $commit" >&2; exit 1; }
done
"""

[tasks."check:vulns"]
description = "Known-vulnerability scan: govulncheck per Go module, Trivy on lockfiles and config"
shell = "bash -c"
run = """
set -euo pipefail
for module in $(go list -m -f '{% raw %}{{.Dir}}{% endraw %}'); do
  if [ -n "$(cd "$module" && go list ./... 2>/dev/null)" ]; then
    (cd "$module" && govulncheck ./...)
  fi
done
trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --quiet .
"""

[tasks."check:actions"]
description = "Lint GitHub Actions workflows"
shell = "bash -c"
run = """
set -euo pipefail
if [ -d .github/workflows ]; then actionlint; else echo "no workflows yet, skipping"; fi
"""
