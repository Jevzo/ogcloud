min_version = "2026.10.19"

# Single source of truth for tool versions (AGENTS.md §9). Renovate keeps them current (D-0052).
[tools]
java = "temurin-25.0.5+8.0.LTS"
go = "1.27.3"
node = "24.22.2"
pnpm = "12.16.1"
terraform = "1.17.0"
helm = "4.3.1"
kubectl = "1.37.1"
minikube = "1.39.0"
tilt = "0.37.8"
buf = "1.75.0"
golangci-lint = "2.15.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trivy = "0.76.1"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.85.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# Each ecosystem adds its own check, fmt, build and test tasks as it lands (T-0004 to T-0008);
# `check` aggregates them through `depends`.
[tasks.check]
description = "Run every quality gate: lint, format check, tests, secret scan"
depends = ["check:secrets", "check:jvm", "check:go", "check:ts", "check:duplication", "check:proto", "check:generated", "check:vulns", "check:actions", "check:commits"]

[tasks."check:secrets"]
description = "Scan the working tree and git history for committed secrets"
run = [
  "gitleaks dir . --redact --no-banner",
  # Only this branch: the v1 branches in the same repository carry their own history.
  "gitleaks git . --redact --no-banner --log-opts=HEAD",
]

[tasks."check:jvm"]
description = "Kotlin format check, compile with warnings as errors, tests, build-logic convention tests"
run = "./gradlew check"

[tasks."fmt:jvm"]
description = "Format Kotlin sources and Gradle scripts"
run = "./gradlew spotlessApply"

# go.work modules are listed by `go list -m`; `./...` does not span workspace modules.
[tasks."check:go"]
description = "go vet, tests with -race, golangci-lint and tidy check for every Go module"
shell = "bash -c"
run = """
set -euo pipefail
for module in $(go list -m -f '{% raw %}{{.Dir}}{% endraw %}'); do
  echo "== $module"
  cd "$module"
  go mod tidy -diff
  if [ -z "$(go list ./... 2>/dev/null)" ]; then
    echo "no packages yet, skipping"
  else
    go vet ./... && go test -race ./... && golangci-lint run ./...
  fi
done
"""

[tasks."fmt:go"]
description = "Format Go sources"
shell = "bash -c"
run = """
set -euo pipefail
for module in $(go list -m -f '{% raw %}{{.Dir}}{% endraw %}'); do
  (cd "$module" && golangci-lint fmt ./...)
done
"""

[tasks."check:ts"]
description = "Biome lint and format check, then type-check every TS package"
run = ["pnpm exec biome ci", "pnpm -r --if-present run typecheck"]

[tasks."fmt:ts"]
description = "Format and fix TypeScript, JavaScript and JSON"
run = "pnpm exec biome check --write"

[tasks."check:duplication"]
description = "Duplicate-code check across Kotlin, Go and TypeScript (AGENTS.md §15)"
run = "pnpm exec jscpd ."

[tasks."check:proto"]
description = "buf lint and format check for contracts/proto"
shell = "bash -c"
run = """
set -euo pipefail
if [ -z "$(find contracts/proto -name '*.proto' -print -quit)" ]; then
  echo "no .proto files yet, skipping"
  exit 0
fi
buf lint
buf format --diff --exit-code
"""

[tasks.gen]
description = "Regenerate every generated source from contracts/"
depends = ["gen:proto", "gen:profiles", "gen:topics"]

[tasks."gen:proto"]
description = "Generate Go code from contracts/proto"
shell = "bash -c"
run = """
set -euo pipefail
if [ -z "$(find contracts/proto -name '*.proto' -print -quit)" ]; then
  echo "no .proto files yet, skipping"
  exit 0
fi
buf generate
"""

[tasks."gen:profiles"]
description = "Generate the runtime profile catalog from contracts/runtime-profiles.yaml"
run = "go run ./data-plane/pkg/cmd/codegen profiles -in contracts/runtime-profiles.yaml -go-out data-plane/pkg/runtimeprofiles/catalog.gen.go -kotlin-out control-plane/domain/src/generated/kotlin/io/ogwars/cloud/domain/runtime/RuntimeProfiles.kt"

[tasks."gen:topics"]
description = "Generate Go and Kotlin topic constants (Strimzi output follows with the chart) from contracts/kafka/topics.yaml"
run = "go run ./data-plane/pkg/cmd/codegen topics -in contracts/kafka/topics.yaml -go-package kafkatopics -go-out data-plane/pkg/kafkatopics/topics.gen.go -kotlin-out control-plane/messaging/src/generated/kotlin/io/ogwars/cloud/messaging/KafkaTopics.kt"

# Each generator's output path is listed here when its first real output is wired (T-0101, T-0102).
[tasks."check:generated"]
description = "Fail when committed generated sources differ from a fresh `mise run gen`"
depends = ["gen"]
shell = "bash -c"
run = """
set -euo pipefail
generated=(data-plane/pkg/gen data-plane/pkg/runtimeprofiles/catalog.gen.go data-plane/pkg/kafkatopics control-plane/domain/src/generated control-plane/messaging/src/generated)
if [ -n "$(git status --porcelain --untracked-files=all -- "${generated[@]}")" ]; then
  git status --short -- "${generated[@]}"
  echo "Generated sources are out of date: run 'mise run gen' and commit the result." >&2
  exit 1
fi
"""

[tasks."hooks:install"]
description = "Install the git commit-msg hook (Conventional Commits, no AI attribution)"
run = "mise generate git-pre-commit --hook commit-msg --task commit-msg --write"

[tasks.commit-msg]
description = "Validate one commit message file (used by the git hook)"
hide = true
run = "go run ./data-plane/pkg/cmd/commitmsg"

# CI sets OGCLOUD_COMMIT_RANGE to the pushed or pull-request range; locally every unpushed commit is checked.
[tasks."check:commits"]
description = "Validate the messages of all commits in range"
shell = "bash -c"
run = """
set -euo pipefail
if [ -n "${OGCLOUD_COMMIT_RANGE:-}" ]; then
  commits=$(git rev-list --no-merges "$OGCLOUD_COMMIT_RANGE")
else
  commits=$(git rev-list --no-merges HEAD --not --remotes)
fi
go build -o .gradle/commitmsg ./data-plane/pkg/cmd/commitmsg
for commit in $commits; do
  # Renovate writes its own Conventional Commit headers, often longer than our 72-character limit.
  if [ "$(git log -1 --format=%an "$commit")" = "renovate[bot]" ]; then continue; fi
  git log -1 --format=%B "$commit" | .gradle/commitmsg - || { echo "in commit $commit" >&2; exit 1; }
done
"""

[tasks."check:vulns"]
description = "Known-vulnerability scan: govulncheck per Go module, Trivy on lockfiles and config"
shell = "bash -c"
run = """
set -euo pipefail
for module in $(go list -m -f '{% raw %}{{.Dir}}{% endraw %}'); do
  if [ -n "$(cd "$module" && go list ./... 2>/dev/null)" ]; then
    (cd "$module" && govulncheck ./...)
  fi
done
trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --quiet .
"""

[tasks."check:actions"]
description = "Lint GitHub Actions workflows"
shell = "bash -c"
run = """
set -euo pipefail
if [ -d .github/workflows ]; then actionlint; else echo "no workflows yet, skipping"; fi
"""
