# Shared defaults (virtual threads, actuator, logs, tracing) come from service-support (D-0088).
spring:
  application:
    name: ogcloud-api
  config:
    import: "optional:configtree:/var/run/secrets/ogcloud/"
  # The API owns the schema (D-0009); the controller's role gets data access only.
  flyway:
    placeholders:
      controllerRole: ${OGCLOUD_CONTROLLER_DB_ROLE:ogcloud_controller}
  mvc:
    problemdetails:
      enabled: true
  session:
    data:
      redis:
        # Indexed by user (D-0095); the chart enables Valkey's keyspace events, the API never runs CONFIG.
        repository-type: indexed
        configure-action: none

server:
  port: 8080
  # Behind the Gateway (D-0098): X-Forwarded-* counts only from trusted proxies, so the client IP the rate limits
  # key on cannot be spoofed, not even from other pods (D-0108).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${ogcloud.web.trusted-proxies}

# Same origin (D-0098): everything the API serves sits under /api, /oauth2, /.well-known, /login and /webauthn.
springdoc:
  api-docs:
    path: /api/openapi
  packages-to-scan: io.ogwars.cloud.api
  # The login and MFA pages are HTML for browsers, not part of the API contract.
  paths-to-match: /api/**

ogcloud:
  web:
    # A regex of proxy addresses: loopback here, Traefik's range from the chart (D-0108).
    trusted-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
  auth:
    # The public origin, also the OIDC issuer (D-0098); the chart sets it.
    issuer: ${OGCLOUD_PUBLIC_ORIGIN}
    signing:
      # `<kid>.pem` files synced from Infisical (D-0044, D-0090); active-key-id arrives through the config tree.
      keys-dir: /var/run/secrets/ogcloud-signing
  kafka:
    # Consumer groups are ogcloud-api-*, matching the generated ACLs.
    client-id: api
