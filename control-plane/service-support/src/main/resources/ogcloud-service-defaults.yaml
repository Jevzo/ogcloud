# Defaults every OgCloud Spring service shares (D-0088); a service's application.yaml overrides them.
spring:
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics are scraped by Prometheus, not pushed over OTLP (D-0072).
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # The chart enables export and sets the OTLP endpoint (D-0072).
    export:
      enabled: false

logging:
  structured:
    format:
      console: ecs
