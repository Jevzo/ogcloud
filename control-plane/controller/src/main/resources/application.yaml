spring:
  application:
    name: ogcloud-controller
  threads:
    virtual:
      enabled: true
  # The API owns and migrates the schema (D-0009); the controller only waits for it.
  flyway:
    enabled: false
  config:
    import: "optional:configtree:/var/run/secrets/ogcloud/"
  grpc:
    server:
      port: 9090
      # A dedicated Netty server; the servlet container only serves actuator endpoints.
      servlet:
        enabled: false
      # Internal TLS from the cert-manager CA (D-0041); the chart defines the `grpc` PEM bundle.
      ssl:
        enabled: true
        bundle: grpc

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, schema
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    # The chart enables export and sets the OTLP endpoint (D-0072).
    export:
      enabled: false

logging:
  structured:
    format:
      console: ecs

ogcloud:
  controller:
    namespace: ${POD_NAMESPACE:ogcloud}
    identity: ${HOSTNAME}
