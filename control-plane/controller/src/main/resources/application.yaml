# Shared defaults (virtual threads, actuator, logs, tracing) come from service-support (D-0088).
spring:
  application:
    name: ogcloud-controller
  # The API owns and migrates the schema (D-0009); the controller only waits for it.
  flyway:
    enabled: false
  config:
    import: "optional:configtree:/var/run/secrets/ogcloud/"
  grpc:
    server:
      port: 9090
      # A dedicated Netty server; the servlet container only serves actuator endpoints.
      servlet:
        enabled: false
      # Internal TLS from the cert-manager CA (D-0041); the chart defines the `grpc` PEM bundle.
      ssl:
        enabled: true
        bundle: grpc

server:
  port: 8080

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState, schema

ogcloud:
  kafka:
    # Consumer groups are ogcloud-controller-*, matching the generated ACLs.
    client-id: controller
  controller:
    namespace: ${POD_NAMESPACE:ogcloud}
    identity: ${HOSTNAME}
