# A single-node k3s cluster (the k3d ordering test and the test server, D-0157) on top of the chart's
# ci/minikube.yaml: back to the chart's k3s defaults where minikube differs.
api:
  trustedProxies: '10\.42\.\d{1,3}\.\d{1,3}'
loadbalancer:
  # k3s's servicelb binds it on the node.
  service:
    type: LoadBalancer
  # ServiceLB masquerades every client as the node's address, so these limits are shared by all players (D-0178).
  limits:
    openPerAddress: 200
    newPerSecond: 50
    newBurst: 100
networkPolicies:
  # k3s's API server listens on 6443 behind the kubernetes Service.
  apiServer:
    cidrs: [0.0.0.0/0]
    ports: [443, 6443]
