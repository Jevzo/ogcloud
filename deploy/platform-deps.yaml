# What OgCloud's chart runs on (D-0021, D-0146): cluster-wide operators and charts, each pinned exactly. Tilt
# (T-0604) and Terraform (T-0702) install them in this order; on k3s every one is applied at once and converges
# by retries (D-0020). Renovate keeps the versions current (D-0052).
#
# values apply everywhere; targets.<name> adds what one install target needs. Entries with `when: monitoring`
# install only with the monitoring toggle (D-0025): off on minikube by default, on for Hetzner.

manifests:
  # Gateway API's Standard channel at the version Traefik 3.7 supports (D-0024).
  - name: gateway-api
    url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
    sha256: 356c2b8e286a964dc20995435659ad1095386329974793af10bbfe3eff977fe5

charts:
  - name: cert-manager
    namespace: cert-manager
    repository: https://charts.jetstack.io
    chart: cert-manager
    version: v1.21.3
    values:
      crds:
        enabled: true

  # Copies the internal CA into OgCloud's namespaces (D-0147); its trust namespace is cert-manager's.
  - name: trust-manager
    namespace: cert-manager
    repository: https://charts.jetstack.io
    chart: trust-manager
    version: v0.26.0
    values:
      secretTargets:
        enabled: false

  - name: traefik
    namespace: traefik
    repository: https://traefik.github.io/charts
    chart: traefik
    version: 42.3.1
    values:
      providers:
        kubernetesIngress:
          enabled: false
        kubernetesGateway:
          enabled: true
      # OgCloud brings its own Gateways (D-0098, D-0045); Traefik only provides the class.
      gateway:
        enabled: false
      gatewayClass:
        enabled: true
        name: traefik
      ingressClass:
        enabled: false
      # The ports OgCloud's Gateway listeners name (edge.ports in its chart); the Service shows them as 80 and 443.
      ports:
        web:
          port: 8000
        websecure:
          port: 8443
        # The internal Gateway's admin UIs (D-0045), exposed only by the private "admin" Service.
        admin:
          port: 9443
          exposedPort: 443
          protocol: TCP
          expose:
            default: false
            admin: true
      service:
        additionalServices:
          admin:
            spec:
              type: ClusterIP
    targets:
      hetzner:
        service:
          annotations:
            load-balancer.hetzner.cloud/name: ogcloud-https
            load-balancer.hetzner.cloud/use-private-ip: "true"
            load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
          # A load balancer in the private network only, which the VPN box forwards to (D-0045).
          additionalServices:
            admin:
              spec:
                type: LoadBalancer
              annotations:
                load-balancer.hetzner.cloud/name: ogcloud-admin
                load-balancer.hetzner.cloud/disable-public-network: "true"
                load-balancer.hetzner.cloud/use-private-ip: "true"

  - name: strimzi
    namespace: strimzi
    repository: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    version: 1.3.1
    values:
      watchNamespaces: [ogcloud]

  - name: cloudnative-pg
    namespace: cnpg-system
    repository: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: 0.29.1

  - name: infisical-secrets-operator
    namespace: infisical-operator
    repository: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: secrets-operator
    version: 0.11.16

  - name: kube-prometheus-stack
    when: monitoring
    namespace: monitoring
    repository: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 93.1.0
    values:
      # Monitors of every namespace count, OgCloud's PodMonitors included (T-0603).
      prometheus:
        prometheusSpec:
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          retention: 15d
      # Grafana loads every namespace's dashboard ConfigMaps, OgCloud's included.
      grafana:
        sidecar:
          dashboards:
            searchNamespace: ALL

  - name: loki
    when: monitoring
    namespace: monitoring
    repository: https://grafana-community.github.io/helm-charts
    chart: loki
    version: 21.0.0
    values:
      deploymentMode: SingleBinary
      loki:
        limits_config:
          retention_period: 14d

  - name: tempo
    when: monitoring
    namespace: monitoring
    repository: https://grafana-community.github.io/helm-charts
    chart: tempo
    version: 3.2.1
    values:
      tempo:
        retention: 168h
