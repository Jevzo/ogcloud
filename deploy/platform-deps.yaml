# What OgCloud's chart runs on (D-0021, D-0150): cluster-wide operators and charts, each pinned exactly. Tilt
# (T-0604) and Terraform (T-0802) install them in this order; on k3s every one is applied at once and converges
# by retries (D-0159). Renovate keeps the versions current (D-0052).
#
# values apply everywhere; targets.<name> adds what one install target needs, named in targets below. Entries with
# `when: monitoring`
# install only with the monitoring toggle (D-0025): off on minikube by default, on for Hetzner. A manifest that
# `follows` a chart holds the CRDs that chart keeps in crds/, which helm upgrade never changes (D-0171); bump the
# manifest (url, sha256, follows.version) with the chart, which a test enforces.

# Every install target: Tilt's minikube, k3s clusters Terraform does not provision (the k3d tests, the test server),
# and Hetzner (T-0802). The installers refuse any other, so a mistyped one cannot drop its values.
targets: [minikube, k3s, hetzner]

manifests:
  # Gateway API's Standard channel at the version Traefik 3.7 supports (D-0024).
  - name: gateway-api
    url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
    sha256: 356c2b8e286a964dc20995435659ad1095386329974793af10bbfe3eff977fe5

  - name: strimzi-crds
    url: https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.3.1/strimzi-crds-1.3.1.yaml
    sha256: 09f6db7000e27d6121e02334e666a55f06f8d62a9124e66adee6c84ec010bf41
    follows:
      chart: strimzi
      version: 1.3.1

  # The operator release that kube-prometheus-stack 93.1.1 ships (its appVersion).
  - name: prometheus-operator-crds
    when: monitoring
    url: https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.95.1/stripped-down-crds.yaml
    sha256: 1a3fe61ea58cfe9c18da5d1ec2be86afdf65471a88dc54c102911aab71d42785
    follows:
      chart: kube-prometheus-stack
      version: 93.1.1

charts:
  - name: cert-manager
    namespace: cert-manager
    repository: https://charts.jetstack.io
    chart: cert-manager
    version: v1.21.3
    values:
      crds:
        enabled: true

  # Copies the internal CA into OgCloud's namespaces (D-0147); its trust namespace is cert-manager's.
  - name: trust-manager
    namespace: cert-manager
    repository: https://charts.jetstack.io
    chart: trust-manager
    version: v0.26.0
    values:
      secretTargets:
        enabled: false

  - name: traefik
    namespace: traefik
    repository: https://traefik.github.io/charts
    chart: traefik
    version: 42.3.1
    values:
      # OgCloud routes through Gateway API only, so Traefik's own CRDs, which its chart cannot upgrade, stay unused.
      providers:
        kubernetesIngress:
          enabled: false
        kubernetesCRD:
          enabled: false
        kubernetesGateway:
          enabled: true
      # OgCloud brings its own Gateways (D-0098, D-0045); Traefik only provides the class.
      gateway:
        enabled: false
      gatewayClass:
        enabled: true
        name: traefik
      ingressClass:
        enabled: false
      # The ports OgCloud's Gateway listeners name (edge.ports in its chart); the Service shows them as 80 and 443.
      ports:
        web:
          port: 8000
        websecure:
          port: 8443
        # The internal Gateway's admin UIs (D-0045), exposed only by the private "admin" Service.
        admin:
          port: 9443
          exposedPort: 443
          protocol: TCP
          expose:
            default: false
            admin: true
      service:
        additionalServices:
          admin:
            spec:
              type: ClusterIP
    targets:
      hetzner:
        service:
          annotations:
            load-balancer.hetzner.cloud/name: ogcloud-https
            load-balancer.hetzner.cloud/use-private-ip: "true"
            load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
          # A load balancer in the private network only, which the VPN box forwards to (D-0045).
          additionalServices:
            admin:
              spec:
                type: LoadBalancer
              annotations:
                load-balancer.hetzner.cloud/name: ogcloud-admin
                load-balancer.hetzner.cloud/disable-public-network: "true"
                load-balancer.hetzner.cloud/use-private-ip: "true"

  - name: strimzi
    namespace: strimzi
    repository: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    version: 1.3.1
    values:
      watchNamespaces: [ogcloud]
      # Kafka's pods meet the restricted Pod Security standard, like every pod in OgCloud's namespace.
      extraEnvs:
        - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
          value: restricted

  - name: cloudnative-pg
    namespace: cnpg-system
    repository: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: 0.29.1

  # PostgreSQL's backups into the backup target (D-0166); it needs CloudNativePG's CRDs and cert-manager.
  - name: barman-cloud
    namespace: cnpg-system
    repository: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    version: 0.9.0

  - name: infisical-secrets-operator
    namespace: infisical-operator
    repository: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: secrets-operator
    version: 0.11.16

  - name: kube-prometheus-stack
    when: monitoring
    namespace: monitoring
    repository: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 93.1.1
    values:
      # Monitors of every namespace count, OgCloud's PodMonitors included (T-0603).
      prometheus:
        prometheusSpec:
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          retention: 15d
      # Grafana loads every namespace's dashboard ConfigMaps, OgCloud's included, and signs in through OgCloud
      # with the environment OgCloud's chart syncs into this namespace (D-0153); without it, its own login.
      grafana:
        sidecar:
          dashboards:
            searchNamespace: ALL
        envFromSecrets:
          - name: ogcloud-grafana-oauth
            optional: true
        # The pods' logs (Alloy into Loki, D-0187) and the services' traces (D-0072) next to the metrics.
        additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc:3100
          - name: Tempo
            type: tempo
            uid: tempo
            url: http://tempo.monitoring.svc:3200

  - name: loki
    when: monitoring
    namespace: monitoring
    repository: https://grafana-community.github.io/helm-charts
    chart: loki
    version: 21.1.0
    # One binary on its own volume, which is all one cluster's logs need; the compactor deletes them after 14 days
    # (D-0043, D-0187).
    values:
      deploymentMode: Monolithic
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem
        schemaConfig:
          configs:
            - from: "2026-01-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        limits_config:
          retention_period: 14d
        compactor:
          retention_enabled: true
          delete_request_store: filesystem
      singleBinary:
        replicas: 1
      read:
        replicas: 0
      write:
        replicas: 0
      backend:
        replicas: 0
      # Grafana and Alloy talk to Loki's own Service; the gateway would add an NGINX.
      gateway:
        enabled: false
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      lokiCanary:
        enabled: false
      test:
        enabled: false

  # Every pod's log into Loki (D-0187): one Alloy per node tails the files kubelet writes.
  - name: alloy
    when: monitoring
    namespace: monitoring
    repository: https://grafana.github.io/helm-charts
    chart: alloy
    version: 1.15.0
    values:
      # Its PodLogs CRD stays unused; the file tailing below needs none.
      crds:
        create: false
      controller:
        type: daemonset
        # The game pool is tainted (D-0047), and its servers' logs matter most.
        tolerations:
          - operator: Exists
      alloy:
        mounts:
          varlog: true
        configMap:
          content: |
            discovery.kubernetes "pods" {
              role = "pod"
              selectors {
                role  = "pod"
                field = "spec.nodeName=" + sys.env("HOSTNAME")
              }
            }

            discovery.relabel "pods" {
              targets = discovery.kubernetes.pods.targets
              rule {
                source_labels = ["__meta_kubernetes_namespace"]
                target_label  = "namespace"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label  = "pod"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label  = "container"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
                target_label  = "component"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                separator     = "/"
                replacement   = "/var/log/pods/*$1/*.log"
                target_label  = "__path__"
              }
            }

            local.file_match "pods" {
              path_targets = discovery.relabel.pods.output
            }

            loki.source.file "pods" {
              targets    = local.file_match.pods.targets
              forward_to = [loki.process.pods.receiver]
            }

            loki.process "pods" {
              stage.cri {}
              forward_to = [loki.write.loki.receiver]
            }

            loki.write "loki" {
              endpoint {
                url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
              }
            }

  - name: tempo
    when: monitoring
    namespace: monitoring
    repository: https://grafana-community.github.io/helm-charts
    chart: tempo
    version: 3.2.1
    values:
      tempo:
        retention: 168h
