{{- /*
The template archives' copy (D-0166): daily, after PostgreSQL's base backup, `backup templates` copies new archives
from the data bucket into the backup target and prunes copies of deleted ones after retention.backups (D-0043).
*/}}
{{- if .Values.backup.enabled }}
{{- if not (regexMatch "^[0-9]+d$" .Values.retention.backups) }}
{{- fail "retention.backups is a number of days, such as 14d" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ogcloud-backup-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.templates.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: {{ .Values.retention.jobTtlSeconds }}
      template:
        metadata:
          labels:
            {{- include "ogcloud.selector" (dict "root" . "component" "backup") | nindent 12 }}
        spec:
          {{- include "ogcloud.backupPod" (dict "root" . "subcommand" "templates") | nindent 10 }}
{{- end }}
