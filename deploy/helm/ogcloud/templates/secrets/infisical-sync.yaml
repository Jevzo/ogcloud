{{- /*
The Secrets Operator logs in as the ogcloud-secrets-sync identity with this service account's token; bootstrap
creates the identity and publishes its id in ogcloud-infisical-identities (D-0114).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogcloud-secrets-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: ogcloud
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  address: {{ .Values.infisical.url | quote }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: ogcloud
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  infisicalConnectionRef:
    name: ogcloud
    namespace: {{ .Release.Namespace }}
  method: kubernetes
  kubernetes:
    identityIdRef:
      name: ogcloud-infisical-identities
      key: ogcloud-secrets-sync
      namespace: {{ .Release.Namespace }}
    serviceAccountRef:
      name: ogcloud-secrets-sync
      namespace: {{ .Release.Namespace }}
{{- range $name, $target := include "ogcloud.syncedSecrets" . | fromYaml }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" $ | nindent 4 }}
spec:
  infisicalAuthRef:
    name: ogcloud
    namespace: {{ $.Release.Namespace }}
  sources:
    - projectSlug: {{ $.Values.infisical.project }}
      environmentSlug: {{ $.Values.infisical.environment }}
      secretPath: /
      recursive: true
  syncOptions:
    refreshInterval: {{ $.Values.infisical.refreshInterval }}
  targets:
    - kind: Secret
      name: {{ $name }}
      namespace: {{ $target.namespace }}
      creationPolicy: Orphan
      {{- with $target.type }}
      secretType: {{ . }}
      {{- end }}
      metadata:
        labels:
          {{- include "ogcloud.labels" $ | nindent 10 }}
        annotations: {}
      template:
        engineVersion: v1
        data:
          {{- range $key, $value := $target.literals }}
          {{ $key | quote }}: {{ $value | quote }}
          {{- end }}
          {{- range $key, $source := $target.keys }}
          {{ $key | quote }}: {{ printf "{{ .%s.Value }}" $source | quote }}
          {{- end }}
{{- end }}
