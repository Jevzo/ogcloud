apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogcloud-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "ogcloud.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ogcloud.selector" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      serviceAccountName: ogcloud-gateway
      automountServiceAccountToken: false
      # Service links would set e.g. OGCLOUD_VALKEY_PORT=tcp://…, which Spring binds to ogcloud.valkey.port.
      enableServiceLinks: false
      priorityClassName: {{ .Values.priorityClasses.platform.name }}
      securityContext:
        {{- include "ogcloud.podSecurity" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "ogcloud.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OGCLOUD_GATEWAY_LISTEN
              value: ":9443"
            - name: OGCLOUD_GAME_NAMESPACE
              value: {{ include "ogcloud.serversNamespace" . }}
            - name: OGCLOUD_CONTROLLER_ADDRESS
              value: ogcloud-controller.{{ .Release.Namespace }}.svc:9090
            - name: OGCLOUD_CONTROLLER_TOKEN_FILE
              value: /var/run/secrets/ogcloud/controller/token
            - name: OGCLOUD_TLS_CERT_FILE
              value: /var/run/secrets/ogcloud-tls/tls.crt
            - name: OGCLOUD_TLS_KEY_FILE
              value: /var/run/secrets/ogcloud-tls/tls.key
            {{- include "ogcloud.goDependencies" (dict "root" . "user" "gateway" "s3" true) | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 9443
            - name: admin
              containerPort: 8081
          {{- include "ogcloud.goProbes" . | nindent 10 }}
          securityContext:
            {{- include "ogcloud.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "ogcloud.commonMounts" . | nindent 12 }}
            - name: secrets
              mountPath: /var/run/secrets/ogcloud/secrets
              readOnly: true
            - name: tls
              mountPath: /var/run/secrets/ogcloud-tls
              readOnly: true
            - name: controller-token
              mountPath: /var/run/secrets/ogcloud/controller
              readOnly: true
            - name: kubernetes
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        {{- include "ogcloud.commonVolumes" . | nindent 8 }}
        - name: secrets
          secret:
            secretName: ogcloud-gateway-secrets
        - name: tls
          secret:
            secretName: ogcloud-gateway-tls
        {{- /* For the controller's internal gRPC only (D-0013). */}}
        - name: controller-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: ogcloud-controller
                  expirationSeconds: 3600
        - name: kubernetes
          {{- include "ogcloud.apiServerAccess" (dict "audience" "") | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ogcloud-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "ogcloud.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: grpc
      port: 9443
      targetPort: grpc
