{{- /*
PostgreSQL on CloudNativePG (D-0009). initdb creates only Infisical's database, whose owner comes from the
bootstrap root stage: OgCloud's own roles need Infisical first (D-0044), so they are managed roles that appear
once their synced Secrets exist, with the ogcloud database owned by the API's role (D-0009).
*/}}
{{- if .Values.postgres.inCluster }}
{{- $pg := .Values.postgres }}
{{ include "ogcloud.internalCertificate" (dict "root" . "name" "ogcloud-postgres-tls"
  "labels" (dict "root" . "component" "postgres")
  "services" (list "ogcloud-postgres-rw" "ogcloud-postgres-ro" "ogcloud-postgres-r")) }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ogcloud-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  instances: {{ $pg.instances }}
  imageName: {{ $pg.image }}
  priorityClassName: {{ .Values.priorityClasses.platform.name }}
  storage:
    size: {{ $pg.storage.size }}
    {{- with $pg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml $pg.resources | nindent 4 }}
  certificates:
    serverTLSSecret: ogcloud-postgres-tls
    serverCASecret: ogcloud-postgres-tls
  {{- if .Values.backup.enabled }}
  # WAL archiving and base backups through the Barman Cloud plugin (D-0166).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ogcloud-backups
        serverName: {{ .Values.backup.serverName }}
  {{- end }}
  {{- with .Values.restore.fromServer }}
  {{- if not $.Values.backup.enabled }}
  {{- fail "restore.fromServer reads the backup target: set backup.enabled" }}
  {{- end }}
  {{- if eq . $.Values.backup.serverName }}
  {{- fail "a restored cluster archives under a new backup.serverName, not the one it restores from" }}
  {{- end }}
  # Restored from the backup archived under {{ . }} (T-0607); the roles and both databases come with it, and the
  # owner's password follows the imported root Secret.
  bootstrap:
    recovery:
      source: backup
      {{- include "ogcloud.postgresInfisicalOwner" $ | nindent 6 }}
  externalClusters:
    - name: backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ogcloud-backups
          serverName: {{ . }}
  {{- else }}
  bootstrap:
    initdb:
      {{- include "ogcloud.postgresInfisicalOwner" . | nindent 6 }}
  {{- end }}
  managed:
    roles:
      {{- range $service := list "api" "controller" }}
      - name: ogcloud_{{ $service }}
        ensure: present
        login: true
        passwordSecret:
          name: ogcloud-postgres-{{ $service }}
      {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ogcloud
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  name: {{ $pg.database }}
  owner: ogcloud_api
  cluster:
    name: ogcloud-postgres
{{- end }}
