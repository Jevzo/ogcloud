apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogcloud-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogcloud-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "ogcloud.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ogcloud.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include "ogcloud.apiConfig" . | sha256sum }}
    spec:
      {{- include "ogcloud.platformPod" (dict "root" . "serviceAccount" "ogcloud-api") | nindent 6 }}
      containers:
        - name: api
          image: {{ include "ogcloud.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/ogcloud/config/
          ports:
            - name: http
              containerPort: 8080
            # Probes and Prometheus only (D-0190).
            - name: admin
              containerPort: 8081
          {{- include "ogcloud.springProbes" . | nindent 10 }}
          securityContext:
            {{- include "ogcloud.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "ogcloud.commonMounts" . | nindent 12 }}
            - name: config
              mountPath: /etc/ogcloud/config
              readOnly: true
            - name: secrets
              mountPath: /var/run/secrets/ogcloud
              readOnly: true
            - name: signing
              mountPath: /var/run/secrets/ogcloud-signing
              readOnly: true
      volumes:
        {{- include "ogcloud.commonVolumes" . | nindent 8 }}
        - name: config
          configMap:
            name: ogcloud-api
        - name: secrets
          secret:
            secretName: ogcloud-api-config
        - name: signing
          secret:
            secretName: ogcloud-api-signing
---
apiVersion: v1
kind: Service
metadata:
  name: ogcloud-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "ogcloud.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
