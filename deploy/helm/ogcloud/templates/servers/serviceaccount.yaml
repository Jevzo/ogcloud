{{- /* Game pods run as this account with no RBAC; they only get a projected gateway token (D-0013). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogcloud-server
  namespace: {{ include "ogcloud.serversNamespace" . }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
automountServiceAccountToken: false
