{{- /*
What bootstrap creates (D-0114), rendered from the chart's secret inventory. A pre-install and pre-upgrade hook,
so it exists before the root stage runs; it stays for the post-install Infisical stage.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogcloud-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  bootstrap.yaml: |
    {{- include "ogcloud.bootstrapConfig" . | nindent 4 }}
