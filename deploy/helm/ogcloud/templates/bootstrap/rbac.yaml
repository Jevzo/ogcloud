{{- /* The bootstrap stages' identity: root Secrets, its state ConfigMap, the identities Secret and the seed. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogcloud-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ogcloud-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ogcloud-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ogcloud-bootstrap
subjects:
  - kind: ServiceAccount
    name: ogcloud-bootstrap
    namespace: {{ .Release.Namespace }}
---
{{- /*
Infisical reviews the controller's audience-bound tokens with this account's long-lived token; every other login's
own token reviews itself (D-0167).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogcloud-infisical-reviewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ogcloud-infisical-reviewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: ogcloud-infisical-reviewer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogcloud-infisical-reviewer
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ogcloud-infisical-reviewer
    namespace: {{ .Release.Namespace }}
---
{{- /* The accounts whose API tokens review themselves at Infisical's login (D-0167), read from bootstrap's config. */}}
{{- $infisical := (include "ogcloud.bootstrapConfig" . | fromYaml).infisical }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogcloud-infisical-token-review
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  {{- range $identity := prepend $infisical.identities $infisical.bootstrapIdentity }}
  {{- if not $identity.audience }}
  {{- range $account := $identity.serviceAccounts }}
  - kind: ServiceAccount
    namespace: {{ (splitList "/" $account) | first }}
    name: {{ (splitList "/" $account) | last }}
  {{- end }}
  {{- end }}
  {{- end }}
