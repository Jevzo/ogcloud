{{- /*
The public edge (D-0024): one hostname for web and API (D-0098). HTTP only redirects; admin surfaces never
attach here, they get the internal Gateway (T-0603, D-0045).
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ogcloud-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  secretName: ogcloud-public-tls
  # Like every certificate here, PKCS#8 (see the internal certificates).
  privateKey:
    encoding: PKCS8
  dnsNames:
    - {{ include "ogcloud.publicHost" . }}
  issuerRef:
    {{- include "ogcloud.publicIssuerRef" . | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ogcloud-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.edge.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.edge.ports.http }}
      hostname: {{ include "ogcloud.publicHost" . }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: {{ .Values.edge.ports.https }}
      hostname: {{ include "ogcloud.publicHost" . }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: ogcloud-public-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ogcloud-https-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: ogcloud-public
      sectionName: http
  hostnames:
    - {{ include "ogcloud.publicHost" . }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- /* Everything the API serves (D-0098); the web app takes the rest once it ships (T-0711). */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ogcloud-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    - name: ogcloud-public
      sectionName: https
  hostnames:
    - {{ include "ogcloud.publicHost" . }}
  rules:
    - matches:
        {{- range $path := list "/api" "/oauth2" "/.well-known" "/login" "/webauthn" }}
        - path:
            type: PathPrefix
            value: {{ $path }}
        {{- end }}
      backendRefs:
        - name: ogcloud-api
          port: 8080
