{{- /*
The public edge (D-0024): one hostname for web and API (D-0098). HTTP only redirects; admin surfaces never
attach here, they get the internal Gateway (T-0603, D-0045), except Grafana at a public host of its own on a private
test cluster (D-0236).
*/}}
{{- $grafanaHost := "" }}
{{- if .Values.admin.grafana.publicHost }}
{{- $grafanaHost = include "ogcloud.grafanaHost" . }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ogcloud-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  secretName: ogcloud-public-tls
  # PKCS#8, like every certificate here (ogcloud.internalCertificate).
  privateKey:
    encoding: PKCS8
  dnsNames:
    - {{ include "ogcloud.publicHost" . }}
    {{- with $grafanaHost }}
    - {{ . }}
    {{- end }}
  issuerRef:
    {{- include "ogcloud.publicIssuerRef" . | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ogcloud-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.edge.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.edge.ports.http }}
      hostname: {{ include "ogcloud.publicHost" . }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: {{ .Values.edge.ports.https }}
      hostname: {{ include "ogcloud.publicHost" . }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: ogcloud-public-tls
      allowedRoutes:
        namespaces:
          from: Same
    {{- with $grafanaHost }}
    - name: grafana-http
      protocol: HTTP
      port: {{ $.Values.edge.ports.http }}
      hostname: {{ . }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: grafana
      protocol: HTTPS
      port: {{ $.Values.edge.ports.https }}
      hostname: {{ . }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: ogcloud-public-tls
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ogcloud-https-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: ogcloud-public
      sectionName: http
    {{- if $grafanaHost }}
    - name: ogcloud-public
      sectionName: grafana-http
    {{- end }}
  hostnames:
    - {{ include "ogcloud.publicHost" . }}
    {{- with $grafanaHost }}
    - {{ . }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- /* Everything the API serves (D-0098); the web app takes the rest. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ogcloud-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    - name: ogcloud-public
      sectionName: https
  hostnames:
    - {{ include "ogcloud.publicHost" . }}
  rules:
    - matches:
        {{- range $path := list "/api" "/oauth2" "/.well-known" "/login" "/webauthn" }}
        - path:
            type: PathPrefix
            value: {{ $path }}
        {{- end }}
      backendRefs:
        - name: ogcloud-api
          port: 8080
---
{{- /* The dashboard takes every other path; Gateway API prefers the API's longer prefixes (D-0098, D-0214). */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ogcloud-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ogcloud.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  parentRefs:
    - name: ogcloud-public
      sectionName: https
  hostnames:
    - {{ include "ogcloud.publicHost" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ogcloud-web
          port: 8080
