{{- /* Server certificates from the internal CA (D-0041), one per service that terminates TLS. */}}
{{- range $service := list "gateway" "controller" }}
---
{{ include "ogcloud.internalCertificate" (dict "root" $ "name" (printf "ogcloud-%s-tls" $service)
  "labels" (dict "root" $ "component" $service) "services" (list (printf "ogcloud-%s" $service))) }}
{{- end }}
