{{- /* Game servers and proxies run here (D-0056); the namespace outlives an uninstall, as STATIC volumes do. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "ogcloud.serversNamespace" . }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
    # Game pods run third-party plugins; the controller builds them to the restricted standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ogcloud-servers
  namespace: {{ include "ogcloud.serversNamespace" . }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.servers.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ogcloud-servers
  namespace: {{ include "ogcloud.serversNamespace" . }}
  labels:
    {{- include "ogcloud.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- toYaml .Values.servers.containerDefaults | nindent 6 }}
