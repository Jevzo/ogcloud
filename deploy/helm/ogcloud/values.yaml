# OgCloud's chart (D-0019). Each install target sets what differs: deploy/dev for minikube, Terraform for Hetzner;
# ci/ holds the value sets `mise run check:chart` renders and validates.

# OgCloud's images (D-0128) are <registry>/<name>:<tag>; the tag defaults to the chart's appVersion (D-0029).
image:
  registry: ghcr.io/jevzo/ogcloud
  tag: ""
  pullPolicy: IfNotPresent

namespaces:
  # Game servers and proxies (D-0056); the platform runs in the release namespace.
  servers: ogcloud-servers

# Ordered platform > proxies > default group > game (D-0056).
priorityClasses:
  platform:
    name: ogcloud-platform
    value: 1000000
  proxy:
    name: ogcloud-proxy
    value: 100000
  defaultGroup:
    name: ogcloud-default-group
    value: 10000
  game:
    name: ogcloud-game
    value: 1000

servers:
  # Caps the game namespace: D-0053's 300 servers and 20 proxies with 2x headroom, plus volumes for STATIC groups.
  quota:
    pods: "700"
    requests.cpu: "800"
    requests.memory: 2000Gi
    persistentvolumeclaims: "100"
  # For containers that name no resources; the controller sets them on every game pod.
  containerDefaults:
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      memory: 512Mi

# The public origin, e.g. https://cloud.example.com: the OIDC issuer and the hostname of every route (D-0098).
publicOrigin: ""

minecraft:
  # Must be set: true records that the network owner accepted the Minecraft EULA (D-0046, D-0100).
  eulaAccepted: null
  # Whether proxies authenticate players with Mojang. Only private test clusters turn it off, so bots join without
  # accounts (D-0162); anyone could then join under any name.
  proxyOnlineMode: true

# Image prefixes a group may run instead of its runtime profile's image; empty forbids overrides (T-0306).
allowedImagePrefixes: []

# The dependencies; this chart runs them in the cluster (T-0602) unless they point elsewhere.
postgres:
  # On CloudNativePG in the cluster (D-0009, D-0021), or an external server at host and port.
  inCluster: true
  host: ogcloud-postgres-rw
  port: 5432
  database: ogcloud
  # PostgreSQL 18 (D-0067), pinned by digest.
  image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  instances: 3
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi
kafka:
  # On Strimzi in the cluster (D-0021), or an external Kafka at bootstrapServers.
  inCluster: true
  clusterName: ogcloud
  # The newest Kafka Strimzi 1.3 runs, as the tests use (D-0113).
  version: 4.3.2
  bootstrapServers: ogcloud-kafka-bootstrap:9093
  replicationFactor: 3
  # KRaft nodes, each controller and broker.
  nodes:
    replicas: 3
    storage: 20Gi
    storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 2Gi
valkey:
  # In the cluster (D-0021): standalone, or a primary and two replicas behind Sentinel (D-0048).
  inCluster: true
  sentinel: false
  image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # An external Valkey: host:port of the server, or of its Sentinels with sentinelMaster.
  addresses: []
  sentinelMaster: ""
s3:
  # SeaweedFS in the cluster (D-0010), or an external S3 such as Hetzner Object Storage at endpoint.
  inCluster: true
  endpoint: ""
  region: us-east-1
  # Also named in seaweedfs.allInOne below; a render test keeps them equal.
  bucket: ogcloud
  # SeaweedFS needs path-style URLs; Hetzner Object Storage takes virtual-hosted ones.
  pathStyle: true
  # The Job that creates the in-cluster bucket.
  bucketJob:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

# The SeaweedFS subchart (D-0146), run as one all-in-one pod with S3 behind our credentials. Its own bucket hook
# is off: it would run before the Infisical bootstrap that its credentials wait for.
global:
  seaweedfs:
    createClusterRole: false
    serviceAccountName: ogcloud-seaweedfs
    automountServiceAccountToken: false
seaweedfs:
  fullnameOverride: ogcloud-seaweedfs
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false
  allInOne:
    enabled: true
    serviceAccountName: ogcloud-seaweedfs
    priorityClassName: ogcloud-platform
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: ogcloud-seaweedfs-s3
    data:
      type: persistentVolumeClaim
      size: 10Gi
    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # Unset the subchart's CPU limit, as for every other workload.
        cpu: null
        memory: 1Gi

# NetworkPolicies (D-0154): everything is denied unless a workload uses it.
networkPolicies:
  # The namespaces deploy/platform-deps.yaml installs the other releases into.
  namespaces:
    traefik: traefik
    monitoring: monitoring
    strimzi: strimzi
    cloudnativePg: cnpg-system
    secretsOperator: infisical-operator
  # Where the Kubernetes API server answers; narrow the CIDRs where its addresses are known.
  apiServer:
    cidrs: [0.0.0.0/0, "::/0"]
    ports: [443, 6443]
  # Addresses of external PostgreSQL, Kafka and Valkey (D-0021).
  externalCidrs: [0.0.0.0/0, "::/0"]
  # Addresses of an external S3 endpoint, required with one: game pods download templates from it, and
  # anything wider would give their plugins the internet (D-0154).
  externalS3Cidrs: []
  # Proxies reach Mojang's session servers on public :443; false for offline development.
  mojang: true

# The monitoring stack from platform-deps.yaml (D-0025): off on minikube, on for Hetzner. With it, the services
# send traces to Tempo; Prometheus scrapes their metrics through ServiceMonitors (T-0603).
monitoring:
  enabled: false
  otlpEndpoint: http://tempo.monitoring.svc:4318/v1/traces
  # The share of new traces recorded.
  traceSampling: 0.1

infisical:
  # Our own Deployment (D-0150); v0.167.6, as the tests run it.
  image: infisical/infisical:v0.167.6@sha256:ca5cbd14b2f170feaaca3fbe5b001b7594c8b9c0c62a491409910f10b05dbb2c
  # TLS in front of Infisical (D-0149).
  ghostunnelImage: ghostunnel/ghostunnel:v1.11.5@sha256:65c4e34ec0ee0f30ea1f72b7411ec70a91c32fc50f067a8466ad2adb1e7420f2
  replicas: 1
  # Where people open Infisical's UI: the internal Gateway (T-0603) or a port-forward; the Service by default.
  siteUrl: ""
  # Node's heap, below the memory limit.
  heapMegabytes: 768
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Infisical's own standalone Valkey (D-0151), from the same template and image as the app Valkey.
  valkey:
    storage:
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # Kubernetes auth: Infisical reviews service-account tokens against this API server (D-0044).
  kubernetesHost: https://kubernetes.default.svc
  organization: OgCloud
  project: ogcloud
  # Holds only the forwarding tokens, so the controller can rotate them and read nothing else (D-0152).
  forwardingProject: ogcloud-forwarding
  environment: prod
  # How often the Secrets Operator copies changes into the cluster's Secrets.
  refreshInterval: 1m

certManager:
  # Holds the internal CA (D-0041); also trust-manager's trust namespace, the source of its Bundle (D-0147).
  namespace: cert-manager

api:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1536Mi
  # Tomcat's internal-proxies regex for Traefik's pod addresses (D-0108); k3s pods live in 10.42.0.0/16.
  trustedProxies: '10\.42\.\d{1,3}\.\d{1,3}'
  templates:
    maxUploadSize: 20GB
  # More Spring properties for the API's application.yaml, e.g. rate limits.
  config: {}

controller:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1536Mi
  pods:
    # STATIC servers' volumes; Hetzner volumes are at least 10 GB (D-0047).
    staticStorageSize: 10Gi
    staticStorageClass: ""
    # The tainted game node pool on Hetzner (D-0047): nodeLabel, nodeLabelValue, taintKey, taintValue.
    gamePool: null
  lifecycle:
    # How long a server may stay in a state, e.g. starting: 5m (D-0179): requested, preparing, starting, heartbeat,
    # stopping, transferGrace. Unset ones keep the controller's defaults.
    timeouts: {}
  config: {}

gateway:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

loadbalancer:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      memory: 256Mi
  service:
    type: LoadBalancer
    annotations: {}
    # Client CIDRs the Service admits, if the cloud's load balancer honours them; empty admits everyone.
    sourceRanges: []
  # CIDRs whose connections must start with a PROXY header, e.g. the Hetzner load balancer's range (D-0118).
  trustedProxies: []
  # Per client address, as openPerAddress, newPerSecond and newBurst; a key left out keeps the load balancer's own
  # default (D-0118). Behind k3s's ServiceLB every client shares one masqueraded address, so there they limit the
  # whole network.
  limits: {}

# Nothing piles up (D-0043); the controller's cleanup loop applies these.
# Backups (D-0166): PostgreSQL through CloudNativePG's Barman Cloud plugin, and the template objects through the
# backup CronJob, into an S3 target of their own; on Hetzner a bucket in another location than the data bucket. The
# bootstrap seed carries its credentials as BACKUP_S3_ACCESS_KEY and BACKUP_S3_SECRET_KEY.
backup:
  enabled: false
  # The name this cluster's PostgreSQL archives under. A restored cluster takes a new one, so it never writes over
  # the backup it came from.
  serverName: ogcloud-postgres
  # CloudNativePG's six-field cron, seconds first: daily at 03:00.
  schedule: "0 0 3 * * *"
  s3:
    endpoint: ""
    region: ""
    bucket: ""
    # The target's addresses, for the NetworkPolicies.
    cidrs: []
    port: 443
    pathStyle: false
  # The template archives' daily copy, after PostgreSQL's base backup.
  templates:
    schedule: "30 3 * * *"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        # Archives are copied in 16 MiB parts, one at a time.
        memory: 128Mi

# Restores a backup into a fresh install (T-0607): PostgreSQL from the server name it was archived under, then the
# template archives. Apply the exported bootstrap state (mise run backup:restore-root-key) before installing.
restore:
  fromServer: ""

retention:
  dryRun: false
  templateVersionsToKeep: 3
  deletedGroupGrace: 7d
  auditLog: 90d
  scalingLog: 30d
  finishedJobs: 30d
  staleCredentials: 30d
  # PostgreSQL backups and template copies (D-0043).
  backups: 14d
  # Finished bootstrap Jobs are removed after this many seconds.
  jobTtlSeconds: 3600

# The public HTTP edge (D-0024, D-0098): a Gateway on Traefik's class with a certificate for publicOrigin's host.
edge:
  gatewayClassName: traefik
  # Traefik's entrypoint ports (deploy/platform-deps.yaml): a listener binds only to an entrypoint's own port.
  ports:
    http: 8000
    https: 8443
  tls:
    # A cert-manager issuer for the public certificate, unless letsEncrypt is on.
    issuer:
      kind: ClusterIssuer
      name: ""
    # The chart's own Let's Encrypt ClusterIssuer, solving DNS-01 through Cloudflare (D-0160). Its API token is the
    # bootstrap seed's CLOUDFLARE_API_TOKEN, which needs DNS edit rights on the public host's zone.
    letsEncrypt:
      enabled: false
      server: https://acme-v02.api.letsencrypt.org/directory
      # Optional; Let's Encrypt no longer mails expiry notices.
      email: ""

# Admin surfaces (D-0045): Infisical's and Grafana's UIs, never on the public Gateway. With the VPN they get the
# internal Gateway behind Traefik's private load balancer; without it, a port-forward.
admin:
  gateway:
    enabled: false
    # Traefik's admin entrypoint (deploy/platform-deps.yaml), which only its private Service exposes.
    port: 9443
    infisicalHost: ""
    grafanaHost: ""
  # Grafana's Service, from kube-prometheus-stack's release in deploy/platform-deps.yaml.
  grafana:
    service: kube-prometheus-stack-grafana
    port: 80

bootstrap:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # The operator's first-install input (D-0114), imported into Infisical's /seed folder and then deleted:
  # INFISICAL_ADMIN_EMAIL and INFISICAL_ADMIN_PASSWORD for the UI's super-admin, plus anything else to seed.
  seed: {}
