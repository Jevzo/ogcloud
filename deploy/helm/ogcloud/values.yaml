# OgCloud's chart (D-0019). Each install target sets what differs: deploy/dev for minikube, Terraform for Hetzner;
# ci/ holds the value sets `mise run check:chart` renders and validates.

# OgCloud's images (D-0128) are <registry>/<name>:<tag>; the tag defaults to the chart's appVersion (D-0029).
image:
  registry: ghcr.io/jevzo/ogcloud
  tag: ""
  pullPolicy: IfNotPresent

namespaces:
  # Game servers and proxies (D-0056); the platform runs in the release namespace.
  servers: ogcloud-servers

# Ordered platform > proxies > default group > game (D-0056).
priorityClasses:
  platform:
    name: ogcloud-platform
    value: 1000000
  proxy:
    name: ogcloud-proxy
    value: 100000
  defaultGroup:
    name: ogcloud-default-group
    value: 10000
  game:
    name: ogcloud-game
    value: 1000

servers:
  # Caps the game namespace: D-0053's 300 servers and 20 proxies with 2x headroom, plus volumes for STATIC groups.
  quota:
    pods: "700"
    requests.cpu: "800"
    requests.memory: 2000Gi
    persistentvolumeclaims: "100"
  # For containers that name no resources; the controller sets them on every game pod.
  containerDefaults:
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      memory: 512Mi

# The public origin, e.g. https://cloud.example.com: the OIDC issuer and the hostname of every route (D-0098).
publicOrigin: ""

minecraft:
  # Must be set: true records that the network owner accepted the Minecraft EULA (D-0046, D-0100).
  eulaAccepted: null

# Image prefixes a group may run instead of its runtime profile's image; empty forbids overrides (T-0306).
allowedImagePrefixes: []

# The dependencies; this chart runs them in the cluster (T-0602) unless they point elsewhere.
postgres:
  # On CloudNativePG in the cluster (D-0009, D-0021), or an external server at host and port.
  inCluster: true
  host: ogcloud-postgres-rw
  port: 5432
  database: ogcloud
  # PostgreSQL 18 (D-0067), pinned by digest.
  image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  instances: 3
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi
kafka:
  # On Strimzi in the cluster (D-0021), or an external Kafka at bootstrapServers.
  inCluster: true
  clusterName: ogcloud
  # The newest Kafka Strimzi 1.3 runs, as the tests use (D-0113).
  version: 4.3.2
  bootstrapServers: ogcloud-kafka-bootstrap:9093
  replicationFactor: 3
  # KRaft nodes, each controller and broker.
  nodes:
    replicas: 3
    storage: 20Gi
    storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 2Gi
valkey:
  # In the cluster (D-0021): standalone, or a primary and two replicas behind Sentinel (D-0048).
  inCluster: true
  sentinel: false
  image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # An external Valkey: host:port of the server, or of its Sentinels with sentinelMaster.
  addresses: []
  sentinelMaster: ""
s3:
  # SeaweedFS in the cluster (D-0010), or an external S3 such as Hetzner Object Storage at endpoint.
  inCluster: true
  endpoint: ""
  region: us-east-1
  # Also named in seaweedfs.allInOne below; a render test keeps them equal.
  bucket: ogcloud
  # SeaweedFS needs path-style URLs; Hetzner Object Storage takes virtual-hosted ones.
  pathStyle: true
  # The Job that creates the in-cluster bucket.
  bucketJob:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

# The SeaweedFS subchart (D-0146), run as one all-in-one pod with S3 behind our credentials. Its own bucket hook
# is off: it would run before the Infisical bootstrap that its credentials wait for.
global:
  seaweedfs:
    createClusterRole: false
    serviceAccountName: ogcloud-seaweedfs
    automountServiceAccountToken: false
seaweedfs:
  fullnameOverride: ogcloud-seaweedfs
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false
  allInOne:
    enabled: true
    serviceAccountName: ogcloud-seaweedfs
    priorityClassName: ogcloud-platform
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: ogcloud-seaweedfs-s3
    data:
      type: persistentVolumeClaim
      size: 10Gi
    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # Unset the subchart's CPU limit, as for every other workload.
        cpu: null
        memory: 1Gi

# The monitoring stack from platform-deps.yaml (D-0025): off on minikube, on for Hetzner. With it, the services
# send traces to Tempo; Prometheus scrapes their metrics through ServiceMonitors (T-0603).
monitoring:
  enabled: false
  otlpEndpoint: http://tempo.monitoring.svc:4318/v1/traces
  # The share of new traces recorded.
  traceSampling: 0.1

infisical:
  # Our own Deployment (D-0150); v0.167.6, as the tests run it.
  image: infisical/infisical:v0.167.6@sha256:ca5cbd14b2f170feaaca3fbe5b001b7594c8b9c0c62a491409910f10b05dbb2c
  # TLS in front of Infisical (D-0149).
  ghostunnelImage: ghostunnel/ghostunnel:v1.11.5@sha256:65c4e34ec0ee0f30ea1f72b7411ec70a91c32fc50f067a8466ad2adb1e7420f2
  replicas: 1
  # Where people open Infisical's UI: the internal Gateway (T-0603) or a port-forward; the Service by default.
  siteUrl: ""
  # Node's heap, below the memory limit.
  heapMegabytes: 768
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Infisical's own standalone Valkey (D-0151), from the same template and image as the app Valkey.
  valkey:
    storage:
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # Kubernetes auth: Infisical reviews service-account tokens against this API server (D-0044).
  kubernetesHost: https://kubernetes.default.svc
  organization: OgCloud
  project: ogcloud
  # Holds only the forwarding tokens, so the controller can rotate them and read nothing else (D-0152).
  forwardingProject: ogcloud-forwarding
  environment: prod
  # How often the Secrets Operator copies changes into the cluster's Secrets.
  refreshInterval: 1m

certManager:
  # Holds the internal CA (D-0041); also trust-manager's trust namespace, the source of its Bundle (D-0147).
  namespace: cert-manager

api:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1536Mi
  # Tomcat's internal-proxies regex for Traefik's pod addresses (D-0108); k3s pods live in 10.42.0.0/16.
  trustedProxies: '10\.42\.\d{1,3}\.\d{1,3}'
  templates:
    maxUploadSize: 20GB
  # More Spring properties for the API's application.yaml, e.g. rate limits.
  config: {}

controller:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1536Mi
  pods:
    # STATIC servers' volumes; Hetzner volumes are at least 10 GB (D-0047).
    staticStorageSize: 10Gi
    staticStorageClass: ""
    # The tainted game node pool on Hetzner (D-0047): nodeLabel, nodeLabelValue, taintKey, taintValue.
    gamePool: null
  config: {}

gateway:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

loadbalancer:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      memory: 256Mi
  service:
    type: LoadBalancer
    annotations: {}
  # CIDRs whose connections must start with a PROXY header, e.g. the Hetzner load balancer's range (D-0118).
  trustedProxies: []

# Nothing piles up (D-0043); the controller's cleanup loop applies these.
retention:
  dryRun: false
  templateVersionsToKeep: 3
  deletedGroupGrace: 7d
  auditLog: 90d
  scalingLog: 30d
  finishedJobs: 30d
  staleCredentials: 30d
  # Finished bootstrap Jobs are removed after this many seconds.
  jobTtlSeconds: 3600

# The public HTTP edge (D-0024, D-0098): a Gateway on Traefik's class with a certificate for publicOrigin's host.
edge:
  gatewayClassName: traefik
  tls:
    # A cert-manager issuer for the public certificate, e.g. a Let's Encrypt ClusterIssuer with Cloudflare DNS-01.
    issuer:
      kind: ClusterIssuer
      name: ""

bootstrap:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # The operator's first-install input (D-0114), imported into Infisical's /seed folder and then deleted:
  # INFISICAL_ADMIN_EMAIL and INFISICAL_ADMIN_PASSWORD for the UI's super-admin, plus anything else to seed.
  seed: {}
