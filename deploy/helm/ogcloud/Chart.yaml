apiVersion: v2
name: ogcloud
description: OgCloud, a Kubernetes-native Minecraft network (D-0019); one chart for minikube, Hetzner and any cluster.
type: application
# One platform version for everything (D-0029); release-please sets both on release (T-0611).
version: 0.0.0-dev
appVersion: 0.0.0-dev
home: https://github.com/Jevzo/ogcloud
dependencies:
  # In-cluster object storage (D-0010, D-0146); Hetzner uses Hetzner Object Storage instead.
  - name: seaweedfs
    version: 4.52.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: s3.inCluster
