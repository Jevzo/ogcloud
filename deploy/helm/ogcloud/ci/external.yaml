# Every dependency outside the cluster (D-0021): no Strimzi, CloudNativePG, Valkey or SeaweedFS from this chart.
publicOrigin: https://cloud.example.com
minecraft:
  eulaAccepted: true
postgres:
  inCluster: false
  host: postgres.example.com
valkey:
  inCluster: false
  addresses:
    - valkey.example.com:6379
s3:
  inCluster: false
  endpoint: https://s3.example.com
kafka:
  inCluster: false
  bootstrapServers: kafka.example.com:9093
edge:
  tls:
    issuer:
      name: letsencrypt
