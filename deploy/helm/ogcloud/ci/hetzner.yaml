# Hetzner as Terraform installs it (D-0003): sized for D-0053, behind the Hetzner load balancer.
publicOrigin: https://cloud.example.com
minecraft:
  eulaAccepted: true
allowedImagePrefixes:
  - ghcr.io/example/
controller:
  pods:
    gamePool:
      nodeLabel: ogcloud.io/pool
      nodeLabelValue: game
      taintKey: ogcloud.io/pool
      taintValue: game
valkey:
  sentinel: true
# Hetzner Object Storage (D-0010); Terraform creates the bucket (T-0702).
s3:
  inCluster: false
  endpoint: https://fsn1.your-objectstorage.com
  region: fsn1
  pathStyle: false
loadbalancer:
  service:
    annotations:
      load-balancer.hetzner.cloud/name: ogcloud-minecraft
      load-balancer.hetzner.cloud/use-private-ip: "true"
  trustedProxies:
    - 10.0.0.0/16
edge:
  tls:
    issuer:
      name: letsencrypt-cloudflare
