# minikube (D-0019): small quotas and one replica each, as `mise run dev` starts it.
publicOrigin: https://ogcloud.localhost
minecraft:
  eulaAccepted: true
servers:
  quota:
    pods: "60"
    requests.cpu: "6"
    requests.memory: 14Gi
    persistentvolumeclaims: "10"
postgres:
  instances: 1
  storage:
    size: 5Gi
kafka:
  replicationFactor: 1
  nodes:
    replicas: 1
    storage: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1Gi
api:
  replicas: 1
  # minikube's pod network.
  trustedProxies: '10\.244\.\d{1,3}\.\d{1,3}'
controller:
  replicas: 1
gateway:
  replicas: 1
loadbalancer:
  replicas: 1
  service:
    type: NodePort
edge:
  tls:
    issuer:
      name: ogcloud-internal
networkPolicies:
  # minikube's API server listens on 8443 behind the kubernetes Service; Calico matches the translated port.
  apiServer:
    cidrs: [0.0.0.0/0]
    ports: [443, 8443]
