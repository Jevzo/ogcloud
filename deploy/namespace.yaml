# OgCloud's release namespace, enforcing the restricted Pod Security standard (T-0603); Tilt and the k3s HelmChart
# module (D-0156) create it before Strimzi, which binds roles in it.
apiVersion: v1
kind: Namespace
metadata:
  name: ogcloud
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
