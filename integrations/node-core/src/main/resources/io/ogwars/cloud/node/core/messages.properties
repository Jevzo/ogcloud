# OgCloud's in-game texts (D-0050) in its tag format (D-0200, docs/architecture/text-format.md), placeholders written as {name}.
# A literal < is written \\< here, since properties files drop a lone backslash.
# A new language is a copy of this file named messages_<language>.properties.
prefix = <dark_gray>| <gold>OgCloud <gray>>
common.failed = <red>Failed: {error}
common.no-permission = <red>You may not do that.
common.players-only = <red>Only players can do that.
common.usage = <gray>Usage: <white>/ogcloud {usage}
common.yes = yes
common.no = no
common.none = none
command.info = <gray>This network runs on <gold>OgCloud<gray>.
command.help.header = <white>Commands:
command.help.entry = <dark_gray>- <white>/ogcloud {usage}
error.not-permitted = you lack the permission
error.player-elsewhere = you are not connected here
error.unknown-group = no such group
error.unknown-permission-group = no such permission group
error.not-own-server = only this server's own
error.unavailable = OgCloud is unavailable, try again
error.invalid = the request was invalid
error.not-connected = not connected to OgCloud yet
server.list.empty = <gray>No servers found.
server.list.header = <white>Servers ({count}):
server.list.entry = <dark_gray>- <white>{server} <gray>[{state}] <dark_gray>players: <white>{players}/{max}
server.not-found = <red>Server '{server}' not found.
server.info.header = <white>Server: {server}
server.info.id = <gray>ID: <white>{id}
server.info.group = <gray>Group: <white>{group}
server.info.state = <gray>State: <white>{state}
server.info.game-state = <gray>Game state: <white>{game_state}
server.info.players = <gray>Players: <white>{players}/{max}
server.info.address = <gray>Address: <white>{host}:{port}
server.requested = <green>Requested {server} in group '{group}'.
server.stopping = <green>Stopping {server}.
server.killed = <green>Killed {server}.
server.pushing = <green>Pushing the template of {server}.
group.list.empty = <gray>No groups found.
group.list.header = <white>Groups ({count}):
group.list.entry = <dark_gray>- <white>{group} <gray>({type}){maintenance} <dark_gray>instances: <white>{min}-{max}
group.list.maintenance = \ <red>[MAINT]
group.not-found = <red>Group '{group}' not found.
group.info.header = <white>Group: {group}
