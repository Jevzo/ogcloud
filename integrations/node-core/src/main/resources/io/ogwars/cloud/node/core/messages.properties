# OgCloud's in-game texts (D-0050): `&` colour codes, placeholders written as {name}.
# A new language is a copy of this file named messages_<language>.properties.
prefix = &8| &6OgCloud &7>
common.failed = &cFailed: {error}
common.no-permission = &cYou may not do that.
common.players-only = &cOnly players can do that.
common.usage = &7Usage: &f/ogcloud {usage}
common.yes = yes
common.no = no
common.none = none
command.info = &7This network runs on &6OgCloud&7.
command.help.header = &fCommands:
command.help.entry = &8- &f/ogcloud {usage}
error.not-permitted = you lack the permission
error.player-elsewhere = you are not connected here
error.unknown-group = no such group
error.unknown-permission-group = no such permission group
error.not-own-server = only this server's own
error.unavailable = OgCloud is unavailable, try again
error.invalid = the request was invalid
error.not-connected = not connected to OgCloud yet
server.list.empty = No servers found.
server.list.header = &fServers ({count}):
server.list.entry = &8- &f{server} &7[{state}] &8players: &f{players}/{max}
server.not-found = &cServer '{server}' not found.
server.info.header = &fServer: {server}
server.info.id = &7ID: &f{id}
server.info.group = &7Group: &f{group}
server.info.state = &7State: &f{state}
server.info.game-state = &7Game state: &f{game_state}
server.info.players = &7Players: &f{players}/{max}
server.info.address = &7Address: &f{host}:{port}
server.requested = &aRequested {server} in group '{group}'.
server.stopping = &aStopping {server}.
server.killed = &aKilled {server}.
server.pushing = &aPushing the template of {server}.
group.list.empty = No groups found.
group.list.header = &fGroups ({count}):
group.list.entry = &8- &f{group} &7({type}){maintenance} &8instances: &f{min}-{max}
group.list.maintenance = \ &c[MAINT]
group.not-found = &cGroup '{group}' not found.
group.info.header = &fGroup: {group}
group.info.type = &7Type: &f{type}
group.info.profile = &7Runtime: &f{profile}
group.info.maintenance = &7Maintenance: &f{maintenance}
group.info.instances = &7Instances: &f{min}-{max}
group.info.players-per-server = &7Players per server: &f{players}
group.maintenance.set = &aGroup '{group}' maintenance {status}&a.
player.not-found = &cPlayer '{player}' is not online.
player.find.header = &fPlayer: {player}
player.find.uuid = &7UUID: &f{uuid}
player.find.server = &7Server: &f{server}
player.find.proxy = &7Proxy: &f{proxy}
player.list.empty = No players on {server}.
player.list.header = &fPlayers on {server} ({count}):
player.list.entry = &8- &f{player} &7server: &f{server}
player.transferring = &aSending {player} to {target}.
target.not-found = &c'{target}' is neither a server nor a group.
network.info.header = &fNetwork:
network.info.maintenance = &7Maintenance: &f{maintenance}
network.info.max-players = &7Max players: &f{max}
network.info.default-group = &7Default group: &f{group}
network.info.motd = &7MOTD: &f{motd}
network.info.version = &7Version: &f{version}
network.maintenance.set = &aNetwork maintenance {status}&a.
perm.group.list.empty = No permission groups found.
perm.group.list.header = &fPermission groups ({count}):
perm.group.list.entry = &8- &f{group} &7({name}) weight: {weight}{default} &8nodes: &f{count}
perm.group.list.default = \ &a[default]
perm.group.not-found = &cPermission group '{group}' not found.
perm.group.info.header = &fPermission group: {group}
perm.group.info.name = &7Name: &f{name}
