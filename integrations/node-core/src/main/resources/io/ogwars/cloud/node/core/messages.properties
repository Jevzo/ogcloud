perm.player.set = &aGiving {player} '{group}' for {duration}.
perm.duration.invalid = &cInvalid duration '{duration}': write it like 1Y 2M 3w 4d 5h 6m 7s, or -1 for permanent.
command.sent = &aSent '{command}' to {target}.
