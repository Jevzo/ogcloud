player.not-found = <red>Player '{player}' is not online.
player.find.header = <white>Player: {player}
player.find.uuid = <gray>UUID: <white>{uuid}
player.find.server = <gray>Server: <white>{server}
player.find.proxy = <gray>Proxy: <white>{proxy}
player.list.empty = <gray>No players on {server}.
player.list.header = <white>Players on {server} ({count}):
player.list.entry = <dark_gray>- <white>{player} <gray>server: <white>{server}
player.transferring = <green>Sending {player} to {target}.
target.not-found = <red>'{target}' is neither a server nor a group.
network.info.header = <white>Network:
