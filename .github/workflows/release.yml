name: Release

on:
  push:
    branches: [v2]
  # A dry run of the publish workflow (docs/runbooks/releases.md). It is started here because GitHub dispatches only
  # workflows it has seen run, and the publish workflow runs only when called.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps the release PR current; merging it tags the release with the one platform version (D-0029, D-0193).
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: v2
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ""
