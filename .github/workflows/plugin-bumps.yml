name: Plugin bumps

# Renovate cannot recompute Modrinth's SHA-512 hashes, so the bundle plugin pins are bumped here (D-0082).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-bumps
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: bump/bundle-plugins
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Skip while a bump PR is open
        id: open
        run: |
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Bump the pins
        if: steps.open.outputs.count == '0'
        id: bump
        run: |
          go run ./data-plane/pkg/cmd/codegen plugins -in contracts/runtime-profiles.yaml > bumps.txt
          if [ -s bumps.txt ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # PRs opened with the workflow token start no CI run, so the checks that matter run here.
      - name: Regenerate and test
        if: steps.bump.outputs.changed == 'true'
        run: |
          mise run gen
          (cd data-plane/pkg && go test ./contracts/...)
      - name: Open the PR
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add contracts/runtime-profiles.yaml control-plane/domain/src/generated data-plane/pkg/runtimeprofiles
          git commit -m "chore(contracts): bump bundle plugins"
          git push origin "$BRANCH"
          { echo "Newest stable Modrinth releases (D-0082):"; echo; sed 's/^/- /' bumps.txt; } > body.md
          gh pr create --base v2 --head "$BRANCH" --title "chore(contracts): bump bundle plugins" --body-file body.md
