name: GHCR cleanup

# Nothing piles up (D-0043, D-0196): dry-run tags go, each package keeps its newest 10 pre-releases and every real
# release, and untagged images are deleted unless a kept one refers to them (architectures, attestations, signatures).
on:
  # GitHub runs schedules only from the default branch; until v2 is main, main's pointer workflow calls this (D-0199).
  schedule:
    - cron: "23 4 * * 1"
  workflow_call:
    inputs:
      dry_run:
        description: Only log what would be deleted
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would be deleted
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/jevzo/ogcloud

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - id: packages
        run: echo "names=$(deploy/release/publish.sh packages)" >>"$GITHUB_OUTPUT"
      # Tags of the publish workflow's dry runs, 0.0.0-dryrun-<commit> or <server version>-0.0.0-dryrun-<commit>. The
      # action refuses nested repetitions such as ([0-9.]+-)?, so the patterns match the tag's end only.
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          owner: ${{ github.repository_owner }}
          packages: ${{ steps.packages.outputs.names }}
          delete-tags: '(^|-)0\.0\.0-dryrun-[0-9a-f]+$'
          use-regex: true
          dry-run: ${{ inputs.dry_run == true }}
      # Real releases are 2.0.0 or <server version>-2.0.0; every other tag is a pre-release.
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          owner: ${{ github.repository_owner }}
          packages: ${{ steps.packages.outputs.names }}
          exclude-tags: '(^|-)[0-9]+\.[0-9]+\.[0-9]+$'
          keep-n-tagged: 10
          delete-untagged: true
          use-regex: true
          dry-run: ${{ inputs.dry_run == true }}
