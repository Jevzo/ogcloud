name: Runtime pin bumps

# Renovate cannot recompute Modrinth's SHA-512 hashes or follow PaperMC and hpfxd builds, so the bundle plugin pins
# (D-0082) and the server jar pins (D-0139) are bumped here.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-pin-bumps
  cancel-in-progress: false

env:
  BRANCH: bump/runtime-pins

jobs:
  # The bumped, not yet reviewed third-party jars run here, in images, so this job holds no write token.
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Skip while a bump PR is open
        id: open
        run: |
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Bump the pins
        if: steps.open.outputs.count == '0'
        id: bump
        run: |
          go run ./data-plane/pkg/cmd/codegen plugins -in contracts/runtime-profiles.yaml > bumps.txt
          go run ./data-plane/pkg/cmd/codegen servers -in contracts/runtime-profiles.yaml >> bumps.txt
          if [ -s bumps.txt ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # PRs opened with the workflow token start no CI run, so the checks that matter run here.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.bump.outputs.changed == 'true'
      - name: Regenerate and test
        if: steps.bump.outputs.changed == 'true'
        run: |
          mise run gen
          (cd data-plane && go test ./pkg/contracts/...)
          mise run check:images
          git diff --binary -- contracts/runtime-profiles.yaml control-plane/domain/src/generated data-plane/pkg/runtimeprofiles images/docker-bake.json > bump.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bump.outputs.changed == 'true'
        with:
          name: bump
          path: |
            bump.patch
            bumps.txt
          retention-days: 1

  # Only applies the tested patch and opens the PR; nothing from the bump runs here.
  pr:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump
          path: ${{ runner.temp }}/bump
      - name: Open the PR
        env:
          BUMP_DIR: ${{ runner.temp }}/bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git apply "$BUMP_DIR/bump.patch"
          git add contracts/runtime-profiles.yaml control-plane/domain/src/generated data-plane/pkg/runtimeprofiles images/docker-bake.json
          git commit -m "chore(contracts): bump runtime pins"
          git push origin "$BRANCH"
          { echo "Newest stable bundle plugins (D-0082) and server builds (D-0139):"; echo; sed 's/^/- /' "$BUMP_DIR/bumps.txt"; } > body.md
          gh pr create --base v2 --head "$BRANCH" --title "chore(contracts): bump runtime pins" --body-file body.md
