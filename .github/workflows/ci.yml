name: CI

on:
  push:
    branches: [v2, main]
  pull_request:
  # Runs everything, the heavy jobs included, on the chosen branch (D-0165).
  workflow_dispatch:
    inputs:
      upgrade_from:
        description: "The ref the upgrade test starts from; empty takes the newest v2 tag, else origin/v2 (D-0172)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      chart: ${{ steps.filter.outputs.chart }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - mise.toml
              - .github/workflows/ci.yml
              # Contracts generate code for both languages; the test images serve both test suites (D-0113).
              - contracts/**
              - testing/**
            jvm:
              - *shared
              - "**/*.kt"
              - "**/*.kts"
              # The API's browser login test drives the login pages (D-0212), built from the web app and its packages.
              - apps/web/**
              - packages/**
              - gradle/**
              - gradle.properties
              - .editorconfig
            go:
              - *shared
              - "**/*.go"
              - "**/go.mod"
              - "**/go.sum"
              - go.work
              - .golangci.yml
              # The chart's render tests live in data-plane/deploytest.
              - deploy/**
            ts:
              - *shared
              - "**/*.ts"
              - "**/*.tsx"
              - "**/*.json"
              - "**/*.jsonc"
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            chart:
              - *shared
              - deploy/**
            terraform:
              - *shared
              - deploy/terraform/**
              - deploy/platform-deps.yaml
              - deploy/namespace.yaml

  # Repository-wide gates: run on every change.
  baseline:
    runs-on: ubuntu-latest
    env:
      # The commits a pull request or push adds. A run by hand or a new branch adds none; a bare commit as the range
      # would check the whole history, back to commits older than the rules. An empty range checks what no remote has.
      OGCLOUD_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      - run: mise run check:secrets
      - run: mise run check:commits
      - run: mise run check:actions
      - run: mise run check:shell
      - run: mise run check:duplication
      - run: mise run check:text
      - run: mise run check:proto
      - run: mise run check:generated
      - run: mise run check:vulns

  jvm:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Chromium for the API's browser login test (D-0099).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: mise run check:jvm

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The chart's upgrade check renders the chart this change builds on.
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run check:go
        env:
          OGCLOUD_CHART_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  # helm lint and kubeconform for every value set of the chart (D-0148).
  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run check:chart

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run check:terraform

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      - run: mise run check:ts

  # Builds every image, boots the server images with OgCloud's plugin (D-0139), starts the platform images, runs the
  # node client against the gateway image (T-0510) and scans the platform images.
  # Heavy: on pushes to main and by hand only (D-0165).
  images:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run check:images

  # Applies every k3s HelmChart at once to a fresh k3d cluster, waits until OgCloud converges (T-0605, D-0159), then
  # runs the end-to-end suite on it (T-0606).
  # Heavy: on pushes to main and by hand only (D-0165).
  k3s:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      # The seed sets the fresh install up through the dashboard's wizard in Chromium (T-0710).
      - run: pnpm --filter @ogcloud/e2e exec playwright install --with-deps chromium
      # Then the end-to-end suite on the same cluster (T-0606).
      - run: mise run test:k3s
        env:
          OGCLOUD_K3S_E2E: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k3s-logs
          path: build/k3s/logs
          if-no-files-found: ignore

  # The backup and restore drill: two installs on k3d with the cluster deleted in between (T-0607, D-0165).
  restore:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ogcloud/e2e exec playwright install --with-deps chromium
      - run: mise run test:restore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-logs
          path: build/k3s/logs
          if-no-files-found: ignore

  # N-1 upgraded to this commit, with the end-to-end suite after it (T-0608, D-0165, D-0172).
  upgrade:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # N-1 is a tag or origin/v2, so the history comes along.
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      # Both installs are seeded through the setup wizard in Chromium (T-0710).
      - run: pnpm --filter @ogcloud/e2e exec playwright install --with-deps chromium
      # Without a tag, origin/v2 is this commit after a push, which the test refuses (D-0191).
      - run: mise run test:upgrade
        env:
          OGCLOUD_UPGRADE_FROM: ${{ inputs.upgrade_from }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-logs
          path: build/k3s/logs
          if-no-files-found: ignore
