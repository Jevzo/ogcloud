name: Publish

# Publishes one version (D-0193 to D-0197): every image for amd64 and arm64 on native runners, merged into one
# manifest list per tag and signed keyless, the chart next to them, then a check of every signature and attestation;
# real releases also put the SDK on Maven Central (D-0195). The release workflow calls it for each release, and
# without a version when started by hand: a dry run under 0.0.0-dryrun-<commit>, whose images and chart the cleanup
# removes again and whose SDK stays an unreleased deployment to drop in the Central Portal.
on:
  workflow_call:
    inputs:
      version:
        description: The version release-please tagged; empty for a dry run
        type: string
        required: true
    # The SDK's Central credentials from the release environment. A reusable workflow sees only the secrets its caller
    # passes, environment secrets included; the SDK job checks they are set, since pre-releases need none (D-0193).
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      SIGNING_KEY:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/jevzo/ogcloud

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # What the SDK does on Central: release, upload (dry run) or none (pre-releases, D-0193).
      central: ${{ steps.version.outputs.central }}
    steps:
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=${RELEASE_VERSION:-0.0.0-dryrun-${GITHUB_SHA::7}}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version: $version" >&2; exit 1; }
          if [[ -z $RELEASE_VERSION ]]; then central=upload; elif [[ $version == *-* ]]; then central=none; else central=release; fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "central=$central" >>"$GITHUB_OUTPUT"

  # Nothing is published before this waits for your approval (D-0196); the SDK's job waits in the same review.
  approve:
    needs: version
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "Publishing $VERSION"

  images:
    needs: [version, approve]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run images:stage
      - run: deploy/release/publish.sh push-images "build/release/metadata-$RUNNER_ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-${{ runner.arch }}
          path: build/release/metadata-*.json
          if-no-files-found: error

  manifests:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: metadata-*
          path: build/release
          merge-multiple: true
      - run: deploy/release/publish.sh merge-images build/release/refs-images.txt build/release/metadata-*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refs-images
          path: build/release/refs-images.txt
          if-no-files-found: error

  chart:
    needs: [version, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # cosign reads Docker's credentials, helm its own.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - run: deploy/release/publish.sh push-chart build/release/refs-chart.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refs-chart
          path: build/release/refs-chart.txt
          if-no-files-found: error

  verify:
    needs: [manifests, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: refs-*
          path: build/release
          merge-multiple: true
      - run: deploy/release/publish.sh verify build/release/refs-images.txt build/release/refs-chart.txt

  sdk:
    needs: version
    if: needs.version.outputs.central != 'none'
    runs-on: ubuntu-latest
    environment: release
    env:
      ORG_GRADLE_PROJECT_ogcloudVersion: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      TASK: ${{ needs.version.outputs.central == 'release' && 'publishAndReleaseToMavenCentral' || 'publishToMavenCentral' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The build signs only with a key, so a missing secret would upload an unsigned deployment Central rejects.
      - run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            [[ -n ${!name} ]] || { echo "the release environment lacks the secret behind $name" >&2; exit 1; }
          done
      # No configuration cache, which would keep the Central credentials it read.
      - run: mise x -- ./gradlew ":integrations:sdk:$TASK" --no-configuration-cache
