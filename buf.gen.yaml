version: v2
# Go only: JVM code is generated by the Gradle protobuf plugin at build time (D-0061).
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jevzo/ogcloud/data-plane/pkg/gen/proto
    # Go refuses imports of a directory named internal from outside its parent, so ogcloud.internal.v1
    # lands in internalapi/v1 for the gateway and the controller clients.
    - file_option: go_package
      path: ogcloud/internal/v1
      value: github.com/jevzo/ogcloud/data-plane/pkg/gen/proto/ogcloud/internalapi/v1;internalv1
plugins:
  - local: protoc-gen-go
    out: data-plane/pkg/gen/proto
    opt: module=github.com/jevzo/ogcloud/data-plane/pkg/gen/proto
  - local: protoc-gen-go-grpc
    out: data-plane/pkg/gen/proto
    opt: module=github.com/jevzo/ogcloud/data-plane/pkg/gen/proto
