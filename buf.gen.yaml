version: v2
# Go only: JVM code is generated by the Gradle protobuf plugin at build time (D-0061).
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jevzo/ogcloud/data-plane/pkg/gen/proto
plugins:
  - local: protoc-gen-go
    out: data-plane/pkg/gen/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: data-plane/pkg/gen/proto
    opt: paths=source_relative
