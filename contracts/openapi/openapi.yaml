components:
  schemas:
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        roleId:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
      required:
      - email
      - enabled
      - roleId
      - username
      - version
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        roleId:
          type: string
        enabled:
          type: boolean
        linkedPlayerUuid:
          type:
          - string
          - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
      required:
      - createdAt
      - email
      - enabled
      - id
      - roleId
      - username
      - version
    PasswordRequest:
      type: object
      properties:
        password:
          type: string
      required:
      - password
    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
      required:
      - name
      - permissions
      - version
    RoleView:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        builtIn:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
      required:
      - builtIn
      - id
      - name
      - permissions
      - version
    SetRankRequest:
      type: object
      properties:
        permissionGroupId:
          type: string
        duration:
          type: string
      required:
      - duration
      - permissionGroupId
    RankView:
      type: object
      properties:
        permissionGroupId:
          type: string
        expiresAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - permissionGroupId
    PermissionGroupSettings:
      type: object
      properties:
        name:
          type: string
        weight:
          type: integer
          format: int32
        defaultGroup:
