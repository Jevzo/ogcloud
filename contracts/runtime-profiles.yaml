# Runtime profile catalog (D-0006): every server platform version OgCloud can run.
# Regenerate with `mise run gen` after editing.

# Velocity forwards player info in BungeeGuard mode to every backend (D-0065).
forwarding: bungeeguard

# Client protocol numbers the load balancer admits: 1.8 up to the newest backend.
clientProtocols:
  min: 47
  max: 777

# The port every server and proxy listens on inside its pod.
serverPort: 25565

# JVM flags every server of a platform starts with, baked into its image; a group's own come after and win (D-0139).
# Backends get Aikar's G1 flags without AlwaysPreTouch (fast autoscaled starts), proxies Velocity's recommended ones.
jvmFlags:
  paper: &backend
    - -XX:InitialRAMPercentage=75
    - -XX:MaxRAMPercentage=75
    - -XX:+UseG1GC
    - -XX:+ParallelRefProcEnabled
    - -XX:MaxGCPauseMillis=200
    - -XX:+UnlockExperimentalVMOptions
    - -XX:+DisableExplicitGC
    - -XX:G1NewSizePercent=30
    - -XX:G1MaxNewSizePercent=40
    - -XX:G1HeapRegionSize=8M
    - -XX:G1ReservePercent=20
    - -XX:G1HeapWastePercent=5
    - -XX:G1MixedGCCountTarget=4
    - -XX:InitiatingHeapOccupancyPercent=15
    - -XX:G1MixedGCLiveThresholdPercent=90
    - -XX:G1RSetUpdatingPauseTimePercent=5
    - -XX:SurvivorRatio=32
    - -XX:+PerfDisableSharedMem
    - -XX:MaxTenuringThreshold=1
  pandaspigot: *backend
  velocity:
    - -XX:InitialRAMPercentage=60
    - -XX:MaxRAMPercentage=60
    - -XX:+UseG1GC
    - -XX:G1HeapRegionSize=4M
    - -XX:+UnlockExperimentalVMOptions
    - -XX:+ParallelRefProcEnabled
    - -XX:+PerfDisableSharedMem

# The smallest memory limit a group of a platform may set (D-0177): below it a loaded server runs out of memory.
# Paper 26.3 at 1 GiB was OOMKilled once players joined, even with a 60% heap; 1.5 GiB held (T-0609).
minimumMemory:
  paper: 1536Mi

# Each profile's server jar is baked into its image (D-0046) and patched there (D-0139). `codegen servers`
# moves build, url, sha256 and source to the newest stable build of the profile's version.
profiles:
  - id: paper-26.3
    platform: paper
    version: "26.3"
    protocol: 777
    java: 25
    server:
      build: 248
      url: https://fill-data.papermc.io/v1/objects/352dbbf965946456a81305f4c4a8d39cb7a8e55a0b0126b417a24efd944b92c2/paper-26.3-248.jar
      sha256: 352dbbf965946456a81305f4c4a8d39cb7a8e55a0b0126b417a24efd944b92c2
      source: https://github.com/PaperMC/Paper/commit/0727243c940172f6731dc63bc195917b629b71f9
  - id: pandaspigot-1.8.8
    platform: pandaspigot
    version: "1.8.8"
    protocol: 47
    java: 25
    server:
      build: 226
      url: https://downloads.hpfxd.com/v2/projects/pandaspigot/versions/1.8.8/builds/226/downloads/paperclip
      sha256: ac73146b275230cbd0612ef0f3d6b40333abd3182beae457cad5321efff6359b
      source: https://github.com/hpfxd/PandaSpigot/commit/1afa5656056df41dd6fec8383927b925c729623d
  - id: velocity-4.3.0
    platform: velocity
    version: "4.3.0"
    java: 25
    server:
      build: 44
      url: https://fill-data.papermc.io/v1/objects/85be73b90f295acd8d5d45a00ad10bac791d4b72b7554172612a89565ebaaa8f/velocity-4.3.0-44.jar
      sha256: 85be73b90f295acd8d5d45a00ad10bac791d4b72b7554172612a89565ebaaa8f
      source: https://github.com/PaperMC/Velocity/commit/4d93ece85bb38b80d82aaf5b03bb33c1355bd6b4

# Third-party plugins in the runtime bundles (D-0079): downloaded by the controller from Modrinth and checked against
# the pinned SHA-512. `codegen plugins` bumps version, url and sha512 together in the weekly pin PR (D-0082).
plugins:
  - id: viaversion
    platforms: [velocity]
    file: ViaVersion.jar
    version: "5.12.2"
    url: https://cdn.modrinth.com/data/P1OZGk5p/versions/Fkfcr89K/ViaVersion-5.12.2.jar
    sha512: c6af11f50e14bc1ba239f5a90be653cce85feee30c473a4b53336b4d5527d790369cf43843f7cb06d3ac3a34fc207e7203436737ca719070644101472453401b
  - id: viabackwards
    platforms: [velocity]
    file: ViaBackwards.jar
    version: "5.12.2"
    url: https://cdn.modrinth.com/data/NpvuJQoq/versions/WFO37e8T/ViaBackwards-5.12.2.jar
    sha512: 78bc7e5fd33ecf13aee31c62e1de46a854e066a1936f294347c6798371357497fe2cc6f23f1d42003ad3050f94ac5382db95e60ffa90d765fada0322b59b0ef9
  - id: viarewind
    platforms: [velocity]
    file: ViaRewind.jar
    version: "4.2.0"
    url: https://cdn.modrinth.com/data/TbHIxhx5/versions/EPLCoxMK/ViaRewind-4.2.0.jar
    sha512: 7f3a2a972a3fe45f9c16b48a2e2b08fca6aa70da77eb8e47644726f19a43dc24116c2f7e126434f9f9388fa1b987a014efe287e3980f773b6e261313e7e939b2
  # Packet library for OgCloud's NPCs; GPL-3.0, so it runs as its own plugin instead of being shaded (D-0137).
  - id: packetevents
    platforms: [paper, pandaspigot]
    file: packetevents.jar
    version: "2.14.0+spigot"
    url: https://cdn.modrinth.com/data/HYKaKraK/versions/m78nFxYg/packetevents-spigot-2.14.0.jar
    sha512: 18a942cb55f64783a63b28deea2cebbbe782e5d6a1089f6700430e183bfbce0a45398a640ed0dff4361b55190dcf47017f2ca7788f4a5c8c9efad1f549a63fe3

# Settings the template loader writes into server files on every start (D-0119), so BungeeGuard forwarding
# (D-0065) works whatever the template holds; the proxies decide who may join, so backends keep no whitelist (Minecraft
# 26 turns it on in a fresh server.properties). YAML keys are dotted paths; ${serverPort} is the port above.
# Velocity needs none: its configs come in the runtime bundle.
overlays:
  - platform: paper
    file: server.properties
    format: properties
    set:
      online-mode: "false"
      enforce-secure-profile: "false"
      white-list: "false"
      server-port: ${serverPort}
  - platform: paper
    file: spigot.yml
    format: yaml
    set:
      settings.bungeecord: "true"
  - platform: pandaspigot
    file: server.properties
    format: properties
    set:
      online-mode: "false"
      white-list: "false"
      server-port: ${serverPort}
  - platform: pandaspigot
    file: spigot.yml
    format: yaml
    set:
      settings.bungeecord: "true"
# Servers start only after the network's owner accepted the Minecraft EULA (D-0100, D-0101), so every backend
# start accepts it on their behalf (D-0139).
  - platform: paper
    file: eula.txt
    format: properties
    set:
      eula: "true"
  - platform: pandaspigot
    file: eula.txt
    format: properties
    set:
      eula: "true"
