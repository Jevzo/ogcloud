syntax = "proto3";

package ogcloud.events.v1;

import "ogcloud/events/v1/common.proto";

option java_multiple_files = true;
option java_package = "io.ogwars.cloud.contracts.events.v1";

// Topic ogcloud.server.command, key server_id. Commands for the controller.
message ServerCommand {
  EventMetadata metadata = 1;
  // Pre-generated by the requester so callers know the id immediately.
  string server_id = 2;
  oneof command {
    RequestServer request = 3;
    StopServer stop = 4;
    KillServer kill = 5;
    PushTemplate push_template = 6;
  }
}

message RequestServer {
  string group_id = 1;
}

// Graceful: a running server drains first.
message StopServer {
  string reason = 1;
}

// Immediate: the pod is deleted without a grace period.
message KillServer {
  string reason = 1;
}

// Upload the server's files as a new template version (D-0042).
message PushTemplate {}

// Topic ogcloud.server.lifecycle, key server_id.
message ServerLifecycleChanged {
  EventMetadata metadata = 1;
  string server_id = 2;
  string group_id = 3;
  GroupType group_type = 4;
  string profile_id = 5;
  ServerState state = 6;
  ServerState previous_state = 7;
  // Pod address once known, for proxies to register backends.
  string host = 8;
  uint32 port = 9;
  uint32 max_players = 10;
  string reason = 11;
}

// Topic ogcloud.server.gamestate, key server_id.
message GameStateChanged {
  EventMetadata metadata = 1;
  string server_id = 2;
  GameState game_state = 3;
}
