syntax = "proto3";

package ogcloud.events.v1;

import "ogcloud/events/v1/common.proto";

option java_multiple_files = true;
option java_package = "io.ogwars.cloud.contracts.events.v1";

// Topic ogcloud.job.requested, key job_id. The job row is already in PostgreSQL (D-0039).
message JobRequested {
  EventMetadata metadata = 1;
  string job_id = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
}

// Topic ogcloud.job.progress, key job_id.
message JobProgress {
  EventMetadata metadata = 1;
  string job_id = 2;
  JobState state = 3;
  uint32 completed_steps = 4;
  uint32 total_steps = 5;
  string message = 6;
}
