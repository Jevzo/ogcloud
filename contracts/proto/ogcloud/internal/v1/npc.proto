syntax = "proto3";

package ogcloud.internal.v1;

import "ogcloud/events/v1/common.proto";
import "ogcloud/node/v1/query.proto";

option java_multiple_files = true;
option java_package = "io.ogwars.cloud.contracts.internal.v1";

// Topic ogcloud.npc.change, key npc_id. An in-game admin's NPC edit for the API to apply like a dashboard
// edit, with the player as actor (D-0129).
message NpcChangeRequested {
  ogcloud.events.v1.EventMetadata metadata = 1;
  // The group of the server it came from; the API refuses NPCs of other groups.
  string group_id = 2;
  oneof change {
    // A new NPC under the id the gateway assigned.
    ogcloud.node.v1.Npc create = 3;
    // Only an NPC of group_id.
    ogcloud.node.v1.Npc update = 4;
    string delete_npc_id = 5;
  }
}
